function renderDocumentos(app){
  let lista=DB.tiposDoc;
  if(docsSearch) lista=lista.filter(d=>(String(d.codigo||'')+' '+String(d.nome||'')+' '+String(d.fase||'')).toLowerCase().includes(docsSearch));

  // Group by fase: ordem fixa Concurso, Contrato, Obra, [outras alfabético], (Sem fase)
  const fasesAtivas=['Concurso','Contrato','Obra'];
  const grupos={};
  fasesAtivas.forEach(f=>grupos[f]=[]);
  lista.forEach(d=>{
    const f=d.fase||'(Sem fase)';
    if(!grupos[f])grupos[f]=[];
    grupos[f].push(d);
  });
  const outras=Object.keys(grupos).filter(f=>!fasesAtivas.includes(f)&&f!=='(Sem fase)').sort();
  const ordem=[...fasesAtivas.filter(f=>grupos[f].length),...outras,...((grupos['(Sem fase)']||[]).length?['(Sem fase)']:[])];

  // Sort within each group
  const sortFn=(a,b)=>{
    const k=docsSort.key;
    let av,bv;
    if(k==='temValidade'){av=a.temValidade!==false?1:0;bv=b.temValidade!==false?1:0;return (av-bv)*docsSort.dir;}
    if(k==='temVersao'){av=a.temVersao!==false?1:0;bv=b.temVersao!==false?1:0;return (av-bv)*docsSort.dir;}
    if(k==='isDefault'){av=a.isDefault===true?1:0;bv=b.isDefault===true?1:0;return (av-bv)*docsSort.dir;}
    av=String(a[k]||'').toLowerCase();
    bv=String(b[k]||'').toLowerCase();
    return av.localeCompare(bv,'pt',{numeric:true})*docsSort.dir;
  };
  ordem.forEach(f=>grupos[f].sort(sortFn));

  // Helpers para th sort
  const arrow=k=>docsSort.key===k?(docsSort.dir>0?' ▲':' ▼'):'';
  const okIcon='<span style="color:var(--gold);font-weight:700">✔</span>';
  const dashIcon='<span style="color:var(--text-muted)">—</span>';

  // Build rows com separadores de grupo
  let rows='';
  if(!ordem.length){
    rows='<tr><td colspan="6" class="empty-state">Sem documentos.</td></tr>';
  } else {
    ordem.forEach(f=>{
      const arr=grupos[f];
      rows+='<tr class="docs-fase-sep"><td colspan="6">'+escapeHtml(f)+'<span class="fase-cnt">('+arr.length+')</span></td></tr>';
      arr.forEach(d=>{
        const id=d.id;
        const nomeEsc=escapeHtml(d.nome||'').replace(/'/g,"\\'");
        rows+='<tr>'
          +'<td><strong>'+escapeHtml(d.codigo||'')+'</strong></td>'
          +'<td>'+escapeHtml(d.nome||'')+'</td>'
          +'<td>'+(d.temValidade!==false?okIcon:dashIcon)+'</td>'
          +'<td>'+(d.temVersao!==false?okIcon:dashIcon)+'</td>'
          +'<td>'+(d.isDefault?okIcon:dashIcon)+'</td>'
          +'<td><div class="actions-cell">'
            +'<button class="btn-icon" onclick="modalEditTipoDoc(\''+id+'\')">✏️</button>'
            +'<button class="btn-icon del" onclick="confirmDel(\'tipoDoc\',\''+id+'\',\''+nomeEsc+'\')">🗑️</button>'
          +'</div></td>'
        +'</tr>';
      });
    });
  }

  app.innerHTML=`
  <div class="table-card">
    <div class="table-wrap">
      <table class="sid-table table-doc-types-fixed">
        <thead><tr>
          <th style="cursor:pointer" onclick="sortDocs('codigo')">Código${arrow('codigo')}</th>
          <th style="cursor:pointer" onclick="sortDocs('nome')">Nome${arrow('nome')}</th>
          <th style="cursor:pointer" onclick="sortDocs('temValidade')">Tem Validade${arrow('temValidade')}</th>
          <th style="cursor:pointer" onclick="sortDocs('temVersao')">Tem Versão${arrow('temVersao')}</th>
          <th style="cursor:pointer" onclick="sortDocs('isDefault')">Default${arrow('isDefault')}</th>
          <th>Ações</th>
        </tr></thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    </div>
  </div>`;
}


function tipoDocFormHtml(d={}){

  const atual=d.fase||'';
  const incluir=[...fasesAtivas];
  if(atual && !fasesAtivas.includes(atual)) incluir.push(atual);
  const fasesOpts=['',...incluir].map(f=>{
    const isLegado=f && !fasesAtivas.includes(f);
    const label=f?(isLegado?f+' (legado)':f):'—';
    return `<option value="${f}" ${atual===f?'selected':''}>${label}</option>`;
  }).join('');
  return `<div style="display:grid;grid-template-columns:1fr 2fr 1fr;gap:9px;margin-bottom:9px">
    <div><label class="form-label">Código *</label><input class="form-input" id="td-cod" value="${d.codigo||''}" placeholder="ex: ATA" style="text-transform:uppercase"></div>
    <div><label class="form-label">Nome *</label><input class="form-input" id="td-nom" value="${d.nome||''}" placeholder="ex: Caderno Encargos"></div>
    <div><label class="form-label">Fase (não editável na obra)</label><select class="form-input" id="td-fase">${fasesOpts}</select></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:9px">
    <div style="display:flex;align-items:center;gap:8px;padding:6px 0">
      <input type="checkbox" id="td-val" ${d.temValidade!==false?'checked':''} style="width:16px;height:16px;cursor:pointer">
      <label for="td-val" class="form-label" style="margin:0;cursor:pointer">Tem Validade</label>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 0">
      <input type="checkbox" id="td-ver" ${d.temVersao!==false?'checked':''} style="width:16px;height:16px;cursor:pointer">
      <label for="td-ver" class="form-label" style="margin:0;cursor:pointer">Tem Versão</label>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 0">
      <input type="checkbox" id="td-def" ${d.isDefault?'checked':''} style="width:16px;height:16px;cursor:pointer">
      <label for="td-def" class="form-label" style="margin:0;cursor:pointer">Default (mostra sempre)</label>

  </div>`;
}

window.saveNovoTipoDoc=async function(){
  const cod=$('td-cod').value.trim().toUpperCase(),nome=$('td-nom').value.trim();
  if(!cod||!nome){alert('Código e Nome são obrigatórios.');return;}
  const fase=$('td-fase')?.value||null;
  const temValidade=$('td-val')?.checked!==false;
  const temVersao=$('td-ver')?.checked!==false;
  const isDefault=$('td-def')?.checked===true;
  const novo={id:uid(),codigo:cod,nome,fase,temValidade,temVersao,isDefault};
  try{
    showLoadingOverlay('A guardar...');
    await sb.post('tipos_doc',{id:novo.id,codigo:cod,nome,fase,tem_validade:temValidade,tem_versao:temVersao,is_default:isDefault});
    DB.tiposDoc.push(novo);
    hideLoadingOverlay();
    closeModal();render();

};

window.saveEditTipoDoc=async function(id){
  const d=DB.tiposDoc.find(x=>x.id===id);if(!d)return;
  d.codigo=$('td-cod').value.trim().toUpperCase();
  d.nome=$('td-nom').value.trim();
  d.fase=$('td-fase')?.value||null;
  d.temValidade=$('td-val')?.checked!==false;
  d.temVersao=$('td-ver')?.checked!==false;
  d.isDefault=$('td-def')?.checked===true;
  try{
    showLoadingOverlay('A guardar...');
    await sb.patch('tipos_doc',id,{codigo:d.codigo,nome:d.nome,fase:d.fase,tem_validade:d.temValidade,tem_versao:d.temVersao,is_default:d.isDefault});

};

function toggleObrasDD(id){
  const existing=document.getElementById('obras-dd-floating');
  if(existing){
    const wasFor=existing.dataset.util;
    existing.remove();
    if(wasFor===String(id))return;
  }
  const btn=document.querySelector(`.obras-dd[data-util="${id}"] .obras-dd-btn`);
  if(!btn)return;
  const u=DB.utilizadores.find(x=>String(x.id)===String(id));
  if(!u)return;
  const atuais=(u.obras||[]).map(String);
  const obrasOrdenadas=[...DB.obras].sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt',{sensitivity:'base'}));
  const menu=document.createElement('div');
  menu.id='obras-dd-floating';
  menu.dataset.util=String(id);
  menu.style.cssText='position:fixed;z-index:9999;background:#fff;border:1px solid #e2e8f0;box-shadow:0 6px 18px rgba(15,23,42,.15);width:300px;max-height:320px;overflow-y:auto;font-size:8.5pt;font-family:Calibri,sans-serif;border-radius:4px';
  menu.innerHTML=obrasOrdenadas.map(o=>'<label style="display:flex;align-items:center;gap:8px;padding:6px 9px;cursor:pointer;border-bottom:1px solid #f1f5f9" onmouseover="this.style.background=\'#f8fafc\'" onmouseout="this.style.background=\'\'">'
    +'<input type="checkbox" class="obras-cb" data-util="'+id+'" value="'+o.id+'"'+(atuais.includes(String(o.id))?' checked':'')+'>'
    +'<span><strong>'+escapeHtml(o.codigo||'')+'</strong> · '+escapeHtml(o.sigla||'')+' · '+escapeHtml(o.nome||'')+'</span>'
    +'</label>').join('');
  document.body.appendChild(menu);
  const r=btn.getBoundingClientRect();
  const w=300, h=Math.min(320,menu.offsetHeight||200);
  let left=r.left;
  if(left+w>window.innerWidth-8)left=window.innerWidth-w-8;
  let top=r.bottom+2;
  if(top+h>window.innerHeight-8)top=Math.max(8,r.top-h-2);
  menu.style.top=top+'px';
  menu.style.left=Math.max(8,left)+'px';
  setTimeout(()=>{
    const close=(e)=>{
      if(!menu.contains(e.target)&&!btn.contains(e.target)){
        menu.remove();
        document.removeEventListener('mousedown',close);
      }
    };
    document.addEventListener('mousedown',close);
  },0);
}

window.gerarPwd=function(){
  const chars='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$';
  const pwd=Array.from({length:10},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  const el=document.getElementById('ga-pwd');
  if(el){el.value=pwd;el.type='text';}
  const preview=document.getElementById('ga-preview');
  if(preview)preview.textContent=pwd;
};
window.saveAcesso=async function(id){
  const u=DB.utilizadores.find(x=>x.id===id);
  if(!u)return;
  const newPwd=document.getElementById('ga-pwd')?.value?.trim();
  if(newPwd){
    if(newPwd.length<8){alert('A password deve ter pelo menos 8 caracteres.');return;}
    u.pwd=newPwd;
    u.pwd_hash=hashPwd(newPwd);
  }
  u.ativo=document.getElementById('ga-ativo')?.value==='1';
  u.apps=Array.from(document.querySelectorAll('.cb-app:checked')).map(x=>x.value);
  try {
    showLoadingOverlay('A guardar...');
    await sb.patch('utilizadores', id, unmapUtil(u));
    hideLoadingOverlay();
    auditLog('Utilizador',u.nome,'editado','Acesso/password actualizado');
    closeModal();render();
  } catch(e) { hideLoadingOverlay(); alert('Erro: '+e.message); }
};
window.revogarAcesso=async function(id){

  if(!u)return;
  if(!confirm('Tem a certeza que pretende revogar o acesso de '+u.nome+'?'))return;
  u.pwd=''; u.pwd_hash=''; u.ativo=false;
  try {
    showLoadingOverlay('A revogar...');
    await sb.patch('utilizadores', id, unmapUtil(u));
    hideLoadingOverlay();

        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>

  </div>

    <div><label class="form-label">Role</label><select class="form-select" id="u-rol" onchange="onUtilRoleChange(this.value)">

    </select></div>
    <div><label class="form-label">Ativo</label><select class="form-select" id="u-ati">
      <option value="1" ${u.ativo!==false?'selected':''}>Sim</option>
      <option value="0" ${u.ativo===false?'selected':''}>Não</option>

    <div>
      <label class="form-label">Especialidades por Obra <span style="font-weight:400;color:var(--text-muted);font-size:7.5pt">— para cada obra associada, escolhe as especialidades deste projetista nessa obra</span></label>

    Para gerir password e acessos às apps, use o botão 🔑 na tabela após guardar.
  </div>`;
}
window.__utilObrasEspInitial=null;
function _captureObrasEspState(){
  const out={};
  document.querySelectorAll('.u-obra-esp-row').forEach(row=>{
    const oid=row.dataset.obra;
    out[oid]=Array.from(row.querySelectorAll('.cb-util-obra-esp:checked')).map(c=>c.value);
  });
  return out;
}
function _renderObrasEspContent(){
  const wrap=document.getElementById('u-obras-esp-wrap');
  const content=document.getElementById('u-obras-esp-content');
  if(!wrap||!content)return;
  const role=document.getElementById('u-rol')?.value;
  if(role!=='projetista'){wrap.style.display='none';return;}
  wrap.style.display='block';
  // captura estado actual + funde com o estado inicial (para obras já existentes mas ainda não tocadas neste modal)
  const cur=_captureObrasEspState();
  const initial=window.__utilObrasEspInitial||{};
  const checkedObras=Array.from(document.querySelectorAll('.cb-util-obra:checked')).map(c=>c.value);
  if(!checkedObras.length){
    content.innerHTML='<div style="color:var(--text-muted);font-size:11px">Selecione obras na secção acima para atribuir especialidades.</div>';
    return;
  }
  if(!DB.especialidades.length){
    content.innerHTML='<div style="color:var(--text-muted);font-size:11px">Sem especialidades cadastradas. Adicione em Configurações → Especialidades.</div>';
    return;
  }
  const html=checkedObras.map(oid=>{
    const o=DB.obras.find(x=>String(x.id)===String(oid));
    if(!o)return '';
    const sel=cur[oid]||initial[oid]||[];
    const espHtml=_sortEsps(DB.especialidades).map(e=>'<label class="multi-opt" style="margin:0"><input type="checkbox" class="cb-util-obra-esp" value="'+escapeHtml(e.codigo)+'"'+(sel.includes(e.codigo)?' checked':'')+'><span class="opt-code">'+escapeHtml(e.codigo)+'</span><span>'+escapeHtml(e.nome||'')+'</span></label>').join('');
    return '<div class="u-obra-esp-row" data-obra="'+oid+'" style="padding:10px 12px;border:1px solid var(--border-light);border-radius:4px;margin-bottom:8px;background:var(--bg)">'
      +'<div style="font-size:9pt;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px"><span class="opt-code" style="background:var(--navy2);color:#fff;padding:2px 6px;border-radius:3px;font-size:8pt">'+escapeHtml(o.codigo||'')+'</span><span style="color:var(--text-muted);font-weight:400;font-size:8pt">'+escapeHtml(o.sigla||'')+'</span><span>'+escapeHtml(o.nome||'')+'</span></div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px">'+espHtml+'</div>'
      +'</div>';
  }).join('');
  content.innerHTML=html;
}
window.onUtilObrasChange=function(){_renderObrasEspContent();};
window.onUtilRoleChange=function(role){
  const fun=document.getElementById('u-fun');
  const isProj=role==='projetista';
  if(fun){
    if(isProj){
      fun.value='Projetista';
      fun.readOnly=true;
      fun.style.background='var(--bg)';
      fun.style.color='var(--text-muted)';
      fun.style.cursor='not-allowed';
      fun.title='Função fixa para projetistas';
    } else {
      fun.readOnly=false;
      fun.style.background='';
      fun.style.color='';
      fun.style.cursor='';
      fun.title='';
    }
  }
  _renderObrasEspContent();
};
function modalNovoUtil(){
  window.__utilObrasEspInitial={};
  showModal('Novo Utilizador',utilFormHtml(),[
    {label:'Cancelar',cls:'btn-outline',fn:'closeModal()'},
    {label:'Guardar',cls:'btn-gold',fn:'saveNovoUtil()'},
  ]);
  setTimeout(()=>_renderObrasEspContent(),0);
}
window.previewFoto=function(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const preview=$('u-foto-preview');
    if(preview)preview.innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover">`;
    const hidden=$('u-foto');
    if(hidden)hidden.value=e.target.result;
  };
  reader.readAsDataURL(file);
};
window.saveNovoUtil=async function(){
  const nome=$('u-nom').value.trim(),email=$('u-em').value.trim();
  if(!nome||!email){alert('Nome e Email são obrigatórios.');return;}
  const obras=Array.from(document.querySelectorAll('.cb-util-obra:checked')).map(x=>x.value);
  const role=$('u-rol').value;
  const funcao=role==='projetista'?'Projetista':$('u-fun').value;
  const foto=$('u-foto')?.value||'';
  // obras_especialidades: só guardar entradas para obras que estejam efectivamente associadas
  const obrasEsp={};
  if(role==='projetista'){
    document.querySelectorAll('.u-obra-esp-row').forEach(row=>{
      const oid=row.dataset.obra;
      if(!obras.includes(oid))return;
      const sel=Array.from(row.querySelectorAll('.cb-util-obra-esp:checked')).map(c=>c.value);
      if(sel.length)obrasEsp[oid]=sel;
    });
  }
  const novo={id:uid(),nome,email,contacto:$('u-tel').value,funcao,role,obras,ativo:$('u-ati').value==='1',pwd:'',pwd_hash:'',apps:['sid'],foto,especialidades:[],obras_especialidades:obrasEsp};
  try {
    showLoadingOverlay('A guardar...');
    await sb.post('utilizadores', unmapUtil(novo));
    DB.utilizadores.push(novo);
    hideLoadingOverlay();
    auditLog('Utilizador',nome,'criado');closeModal();render();
  } catch(e) {
    hideLoadingOverlay();
    const msg=String(e.message||'');
    if(msg.includes('23505')&&msg.includes('email')) alert('Já existe um utilizador com o email "'+email+'". Use um email diferente.');
    else alert('Erro ao criar utilizador: '+msg);
  }
};
function modalEditUtil(id){
  const u=DB.utilizadores.find(x=>x.id===id);if(!u)return;
  window.__utilObrasEspInitial=u.obras_especialidades||{};
  showModal('Editar Utilizador',utilFormHtml(u),[
    {label:'Cancelar',cls:'btn-outline',fn:'closeModal()'},
    {label:'Guardar',cls:'btn-gold',fn:`saveEditUtil('${id}')`},
  ]);
  setTimeout(()=>_renderObrasEspContent(),0);
}
window.saveEditUtil=async function(id){
  const u=DB.utilizadores.find(x=>x.id===id);if(!u)return;
  const newEmail=$('u-em').value.trim();
  const newNome=$('u-nom').value.trim();
  if(!newNome||!newEmail){alert('Nome e Email são obrigatórios.');return;}
  u.nome=newNome;u.email=newEmail;u.contacto=$('u-tel').value;
  u.role=$('u-rol').value;
  u.funcao=u.role==='projetista'?'Projetista':$('u-fun').value;
  u.ativo=$('u-ati').value==='1';
  u.obras=Array.from(document.querySelectorAll('.cb-util-obra:checked')).map(x=>x.value);
  // obras_especialidades só para projetista; só persiste entradas para obras associadas
  if(u.role==='projetista'){
    const obrasEsp={};
    document.querySelectorAll('.u-obra-esp-row').forEach(row=>{
      const oid=row.dataset.obra;
      if(!u.obras.includes(oid))return;
      const sel=Array.from(row.querySelectorAll('.cb-util-obra-esp:checked')).map(c=>c.value);
      if(sel.length)obrasEsp[oid]=sel;
    });
    u.obras_especialidades=obrasEsp;
  } else {
    u.obras_especialidades={};
  }
  const foto=$('u-foto')?.value;if(foto)u.foto=foto;
  try {
    showLoadingOverlay('A guardar...');
    await sb.patch('utilizadores', id, unmapUtil(u));
    hideLoadingOverlay();
    auditLog('Utilizador',u.nome,'editado');closeModal();render();
  } catch(e) {
    hideLoadingOverlay();
    const msg=String(e.message||'');
    if(msg.includes('23505')&&msg.includes('email')) alert('Já existe outro utilizador com o email "'+u.email+'". Use um email diferente.');
    else alert('Erro ao guardar utilizador: '+msg);
  }
};

function confirmDel(tipo,id,nome){
  showModal('Confirmar eliminação',`<p style="font-size:13px;color:var(--text-muted);line-height:1.5">Tem a certeza que pretende eliminar <strong>${nome}</strong>?<br>Esta ação não pode ser revertida.</p>`,[
    {label:'Cancelar',cls:'btn-outline',fn:'closeModal()'},
    {label:'Eliminar',cls:'btn-danger',fn:`doDelete('${tipo}','${id}','${nome.replace(/'/g,"\\'")}')`},
  ]);
}
const TIPO_TABLE={obra:'obras',subempreiteiro:'subempreiteiros',especialidade:'especialidades',tipoDoc:'tipos_doc',utilizador:'utilizadores'};
window.doDelete=async function(tipo,id,nome){
  try {
    const table=TIPO_TABLE[tipo];
    if(table){ showLoadingOverlay('A eliminar...'); await sb.delete(table,id); hideLoadingOverlay(); }
    if(tipo==='obra'){DB.obras=DB.obras.filter(o=>o.id!==id);if(fichObraId===id)fichObraId=null;}
    else if(tipo==='subempreiteiro')DB.subempreiteiros=DB.subempreiteiros.filter(s=>s.id!==id);
    else if(tipo==='especialidade')DB.especialidades=DB.especialidades.filter(e=>e.id!==id);
    else if(tipo==='utilizador')DB.utilizadores=DB.utilizadores.filter(u=>u.id!==id);
    else if(tipo==='tipoDoc')DB.tiposDoc=DB.tiposDoc.filter(d=>d.id!==id);
    auditLog(tipo,nome,'eliminado');
    closeModal();render();
  } catch(e){ hideLoadingOverlay(); alert('Erro ao eliminar: '+e.message); }
};

function showModal(title,body,btns=[],cls='',leftBtn=''){
  $('modal-title').textContent=title;
  $('modal-body').innerHTML=body;
  $('modal-footer').innerHTML=(leftBtn||'')+btns.map(b=>`<button class="btn ${b.cls}" onclick="${b.fn}">${b.label}</button>`).join('');
  $('modal-box').className='modal form-8pt'+(cls?' '+cls:'');
  $('modal').style.display='flex';
}

window.toggleChat=function(){
  const panel=document.getElementById('chat-panel');
  const notif=document.getElementById('chat-notif');
  if(!panel)return;
  const open=panel.style.display==='flex';
  panel.style.display=open?'none':'flex';
  if(!open&&notif)notif.style.display='none';
};
window.askSugg=function(q){
  document.getElementById('chat-suggestions')?.remove();
  addChatMsg(q,'user');
  setTimeout(()=>addChatMsg(chatAnswer(q),'bot'),300);
};
window.sendChat=function(){
  const inp=document.getElementById('chat-input');
  const q=inp?.value?.trim();
  if(!q)return;
  inp.value='';
  addChatMsg(q,'user');
  setTimeout(()=>addChatMsg(chatAnswer(q),'bot'),300);
};
window.addChatMsg=function(txt,who){
  const box=document.getElementById('chat-msgs');
  if(!box)return;
  const d=document.createElement('div');
  d.className='chat-msg chat-'+who;
  d.textContent=txt;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
};
window.chatAnswer=function(q){
  const ql=q.toLowerCase();
  const obras=getObrasVisiveis?getObrasVisiveis():DB.obras;
  if(ql.includes('em curso')||ql.includes('ativas')||ql.includes('quantas obras')){
    const ec=obras.filter(o=>o.estado==='Em Curso');
    return `Há ${ec.length} obra(s) em curso: ${ec.map(o=>o.sigla+' — '+o.nome).join(', ')}.`;
  }
  if(ql.includes('suspens')){
    const s=obras.filter(o=>o.estado==='Suspensa');
    return s.length?`Obras suspensas: ${s.map(o=>o.sigla+' — '+o.nome).join(', ')}.`:'Não há obras suspensas.';
  }
  if(ql.includes('conclu')){
    const c=obras.filter(o=>o.estado==='Concluída');
    return `${c.length} obra(s) concluída(s): ${c.map(o=>o.sigla).join(', ')}.`;
  }
  if(ql.includes('prepara')){
    const p=obras.filter(o=>o.estado==='Em Preparação');
    return p.length?`Em preparação: ${p.map(o=>o.sigla+' — '+o.nome).join(', ')}.`:'Nenhuma obra em preparação.';
  }
  if(ql.includes('fiscal')){
    const obra=obras.find(o=>ql.includes(o.sigla.toLowerCase())||ql.includes(o.nome.toLowerCase()));
    if(obra){
      const fisc=DB.utilizadores.filter(u=>(u.role==='fiscalizacao'||u.role==='superadmin')&&Array.isArray(u.obras)&&u.obras.includes(obra.id));
      return fisc.length?`Fiscalização da obra ${obra.sigla}: ${fisc.map(u=>u.nome+(u.funcao?' ('+u.funcao+')':'')).join(', ')}.`:`Sem fiscalização associada à obra ${obra.sigla}.`;
    }
    return 'Pode especificar a sigla ou nome da obra?';
  }
  if(ql.includes('valor')||ql.includes('total')){
    const total=obras.filter(o=>o.valorObra).reduce((s,o)=>s+(o.valorObra||0),0);
    return `Valor total das obras: ${total.toLocaleString('pt-PT')}€.`;
  }
  if(ql.includes('utilizador')||ql.includes('user')){
    return `${DB.utilizadores.filter(u=>u.ativo).length} utilizadores activos.`;
  }
  if(ql.includes('cliente')){
    return `${DB.obras.length} obras registadas na base de dados.`;
  }
  if(ql.includes('ajuda')||ql.includes('help')||ql.includes('o que podes')){
    return 'Posso responder sobre: obras em curso/suspensas/concluídas, fiscalização de obras, valor total, utilizadores, clientes. Experimente: "fiscal da obra AB" ou "obras em preparação".';
  }
  const obra=obras.find(o=>ql.includes(o.sigla.toLowerCase())||ql.includes(o.nome.toLowerCase())||ql.includes(o.codigo.toLowerCase()));
  if(obra){
    return `${obra.sigla} — ${obra.nome}: ${obra.estado}, ${obra.localidade||'localidade não definida'}, valor ${obra.valorObra?obra.valorObra.toLocaleString('pt-PT')+'€':'não definido'}, fim previsto ${obra.fimPrevisto||'não definido'}.`;
  }
  return 'Não encontrei essa informação. Tente perguntar sobre obras (sigla ou nome), fiscalização, valores ou estados.';
};
