<!DOCTYPE html>
<html lang="pt"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SID — Sistema de Informação e Dados | aceitar</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1E3A5F;--navy2:#2C4E7A;
  --gold:#C9922A;--gold-light:#E8A830;
  --border:#2E3A4A;--border-light:#D8DCE6;
  --bg:#F0F2F5;--bg-card:#FFFFFF;
  --text:#1A1D2E;--text-muted:#6B7280;
  --success:#1A7A4A;--success-bg:#E6F4ED;
  --warning:#7C5E0A;--warning-bg:#FEF3CD;
  --danger:#B91C1C;--danger-bg:#FEE2E2;
  --info:#1B4F9B;--info-bg:#DBEAFE;
  --purple:#6D28D9;--purple-bg:#EDE9FE;
  --radius:4px;
}
html,body{height:100%;font-family:'Calibri',Calibri,sans-serif;font-size:13px;background:var(--bg);color:var(--text)}

/* LAYOUT */
.layout{display:flex;flex-direction:column;min-height:100vh}

/* NAVBAR */
.navbar{background:var(--navy);height:44px;display:flex;align-items:center;padding:0 12px;position:sticky;top:0;z-index:100;border-bottom:2px solid var(--gold);flex-shrink:0}
.nav-logo{display:flex;align-items:center;gap:7px;margin-right:14px;flex-shrink:0}
.nav-logo-text{color:#fff;font-size:15px;font-weight:700;letter-spacing:.5px}
.nav-logo-sub{color:rgba(255,255,255,.4);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;display:block;margin-top:-2px}
.nav-items{display:flex;align-items:center;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-items::-webkit-scrollbar{display:none}
.nav-item{display:flex;align-items:center;gap:5px;padding:0 10px;height:44px;cursor:pointer;color:rgba(255,255,255,.7);font-size:13px;font-family:'Calibri',Calibri,sans-serif;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;user-select:none}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav-item.active{color:#fff;background:var(--gold);border-bottom-color:var(--gold-light)}
.nav-item svg{width:13px;height:13px;flex-shrink:0}
.nav-right{display:flex;align-items:center;gap:6px;margin-left:auto;padding-left:8px;flex-shrink:0}
.nav-avatar{width:28px;height:28px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0}

/* CONTENT */
.content{flex:1;padding:16px 20px}

/* PAGE HEADER */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.page-title{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px}
.page-count{font-size:11px;color:var(--text-muted);margin-top:2px}
.page-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* TABS */
.tabs-bar{background:var(--navy);display:flex;overflow-x:auto;scrollbar-width:none;border-radius:var(--radius) var(--radius) 0 0}
.tabs-bar::-webkit-scrollbar{display:none}
.tab{padding:8px 13px;font-size:13px;font-family:'Calibri',Calibri,sans-serif;cursor:pointer;color:rgba(255,255,255,.6);white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;user-select:none}
.tab:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.05)}
.tab.active{color:#fff;border-bottom-color:var(--gold);background:rgba(255,255,255,.08)}
.tabs-right{margin-left:auto;display:flex;align-items:center;padding-right:8px;gap:6px}

/* TABLE */
.table-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius);overflow:hidden}
.table-card.notop{border-radius:0 0 var(--radius) var(--radius)}
.table-toolbar{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--border-light);flex-wrap:wrap;background:var(--bg-card)}
.table-count{font-size:11px;color:var(--text-muted)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-family:'Calibri',Calibri,sans-serif}
thead tr{background:var(--navy)}
th{padding:6px 10px;font-weight:700;color:rgba(255,255,255,.85);font-size:11px;text-align:left;white-space:nowrap;border-right:1px solid var(--border)}
th:last-child{border-right:none}
td{padding:7px 11px;border-bottom:1px solid var(--border-light);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.tr-click{cursor:pointer}
tr.tr-click:hover td{background:#F5F7FA}

/* CODES */
.code-pill{display:inline-block;background:var(--navy2);color:rgba(255,255,255,.85);padding:2px 6px;border-radius:3px;font-size:11px;font-family:monospace;font-weight:600}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.b-em-curso{background:var(--info-bg);color:var(--info)}
.b-concluida{background:var(--success-bg);color:var(--success)}
.b-suspensa{background:var(--warning-bg);color:var(--warning)}
.b-prep{background:#F3F4F6;color:var(--text-muted)}
.b-superadmin{background:var(--purple-bg);color:var(--purple)}
.b-fiscal{background:var(--gold);color:#fff}
.b-cliente{background:var(--info-bg);color:var(--info)}
.b-empreiteiro{background:var(--warning-bg);color:var(--warning)}
.b-projetista{background:var(--success-bg);color:var(--success)}
.b-ativo{background:var(--success-bg);color:var(--success)}
.b-inativo{background:#F3F4F6;color:var(--text-muted)}
.b-criado{background:var(--info-bg);color:var(--info)}
.b-editado{background:#F3F4F6;color:var(--text-muted)}
.b-eliminado{background:var(--danger-bg);color:var(--danger)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--radius);font-size:13px;font-family:'Calibri',Calibri,sans-serif;font-weight:700;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:var(--gold-light)}
.btn-outline{background:var(--bg-card);border:1px solid var(--border-light);color:var(--text)}
.btn-outline:hover{background:var(--bg)}
.btn-danger-outline{background:var(--bg-card);border:1px solid #FCA5A5;color:var(--danger)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{opacity:.9}
.btn-sm{padding:4px 9px;font-size:12px}
.btn-xs{padding:2px 7px;font-size:11px}
.btn-icon{background:none;border:none;cursor:pointer;padding:3px 5px;color:var(--text-muted);border-radius:var(--radius);font-size:14px;line-height:1}
.btn-icon:hover{background:var(--bg)}
.btn-icon.del:hover{color:var(--danger);background:var(--danger-bg)}

/* FILTER */
.filter-select{background:var(--bg-card);border:1px solid var(--border-light);padding:4px 8px;border-radius:var(--radius);font-size:12px;font-family:'Calibri',Calibri,sans-serif;color:var(--text);cursor:pointer}
.filter-select:focus{outline:none;border-color:var(--gold)}

/* SEARCH */
.search-wrap{position:relative;display:flex;align-items:center}
.search-input{background:var(--bg);border:1px solid var(--border-light);padding:5px 8px 5px 26px;border-radius:var(--radius);font-size:12px;font-family:'Calibri',Calibri,sans-serif;color:var(--text);width:180px}
.search-input:focus{outline:none;border-color:var(--gold);background:#fff}
.search-icon{position:absolute;left:7px;color:var(--text-muted);pointer-events:none;width:13px;height:13px}

/* OBRA/TAGS */
.obra-tag{display:inline-block;background:var(--info-bg);color:var(--info);padding:1px 6px;border-radius:3px;font-size:11px;margin:1px 2px 1px 0;white-space:nowrap}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius);padding:10px 12px;border-top:3px solid var(--gold);cursor:pointer;transition:box-shadow .15s}
.stat-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stat-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.stat-value{font-size:20px;font-weight:700;color:var(--navy);margin:3px 0 0}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
.modal{background:var(--bg-card);border-radius:var(--radius);width:100%;max-width:620px;box-shadow:0 8px 40px rgba(0,0,0,.25);margin:auto}
.modal-lg{max-width:840px}
.modal-header{background:var(--navy);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--gold);border-radius:var(--radius) var(--radius) 0 0;position:sticky;top:0;z-index:10}
.modal-title{color:#fff;font-size:13px;font-weight:700}
.modal-body{padding:14px}
.modal-footer{padding:10px 15px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:7px;background:var(--bg);border-radius:0 0 var(--radius) var(--radius);position:sticky;bottom:0}

/* MODAL TABS */
.modal-tabs{display:flex;border-bottom:1px solid var(--border-light);margin-bottom:12px;overflow-x:auto;scrollbar-width:none;background:var(--bg);margin:-14px -14px 12px;padding:0 14px}
.modal-tabs::-webkit-scrollbar{display:none}
.modal-tab{padding:8px 12px;font-size:12px;font-family:'Calibri',Calibri,sans-serif;cursor:pointer;color:var(--text-muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;user-select:none}
.modal-tab:hover{color:var(--text)}
.modal-tab.active{color:var(--navy);border-bottom-color:var(--gold);font-weight:700}

/* FORM */
.form-row{display:grid;gap:9px;margin-bottom:9px}
.f2{grid-template-columns:1fr 1fr}
.f3{grid-template-columns:1fr 1fr 1fr}
.f4{grid-template-columns:1fr 1fr 1fr 1fr}
.modal .f2{grid-template-columns:1fr 1fr!important}
.modal .f3{grid-template-columns:1fr 1fr 1fr!important}
.modal .f4{grid-template-columns:1fr 1fr 1fr 1fr!important}
.form-label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;display:block}
.form-input,.form-select,.form-textarea{width:100%;background:var(--bg);border:1px solid var(--border-light);border-radius:var(--radius);padding:5px 8px;font-size:13px;font-family:'Calibri',Calibri,sans-serif;color:var(--text);transition:border-color .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--gold);background:#fff}
.form-input[readonly]{color:var(--text-muted);background:#F8F9FB;cursor:default}
.form-textarea{min-height:65px;resize:vertical}
.sec-div{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin:12px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--border-light)}

/* MULTI-SELECT */
.multi-wrap{border:1px solid var(--border-light);border-radius:var(--radius);background:var(--bg);max-height:140px;overflow-y:auto}
.multi-opt{display:flex;align-items:center;gap:7px;padding:5px 8px;cursor:pointer;transition:background .1s;font-size:12px}
.multi-opt:hover{background:var(--border-light)}
.multi-opt input{accent-color:var(--gold);flex-shrink:0}
.multi-opt .opt-code{color:var(--gold);font-family:monospace;font-size:11px;font-weight:700;margin-right:2px}

/* UPLOAD FIELD */
.upload-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-light)}
.upload-row:last-child{border-bottom:none}
.upload-label-txt{font-size:12px;color:var(--text-muted);width:130px;flex-shrink:0}
.upload-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px dashed var(--border-light);border-radius:var(--radius);font-size:12px;cursor:pointer;color:var(--text-muted);background:var(--bg);transition:all .15s;font-family:'Calibri',Calibri,sans-serif}
.upload-btn:hover{border-color:var(--gold);color:var(--gold)}
.upload-btn input[type=file]{display:none}
.upload-filename{font-size:11px;color:var(--text-muted);font-style:italic}

/* PRORROGACAO */
.prorr-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.prorr-item{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border-light);border-radius:var(--radius);padding:6px 10px;font-size:12px}
.prorr-item span{flex:1}

/* FICHA OBRA */
.back-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:none;border:1px solid var(--border-light);border-radius:var(--radius);cursor:pointer;font-size:12px;font-family:'Calibri',Calibri,sans-serif;color:var(--text-muted);margin-bottom:10px;transition:all .15s}
.back-btn:hover{background:var(--bg);color:var(--text)}
.ficha-tabs{display:flex;background:var(--navy);overflow-x:auto;scrollbar-width:none;border-radius:var(--radius) var(--radius) 0 0}
.ficha-tabs::-webkit-scrollbar{display:none}
.ficha-tab{padding:7px 12px;font-size:12px;cursor:pointer;color:rgba(255,255,255,.6);white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;user-select:none}
.ficha-tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.ficha-tab.active{color:#fff;border-bottom-color:var(--gold);background:rgba(255,255,255,.08)}
.ficha-body{padding:14px}
.field-row{display:grid;grid-template-columns:160px 1fr;border-bottom:1px solid var(--border-light);padding:5px 0;min-height:30px}
.field-label{font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;padding-right:10px}
.field-value{font-size:13px;color:var(--text);display:flex;align-items:center;flex-wrap:wrap;gap:3px}
.intv-card{background:var(--bg);border:1px solid var(--border-light);border-radius:var(--radius);padding:9px 12px;margin-bottom:7px}
.intv-name{font-weight:700;font-size:13px}
.intv-info{font-size:12px;color:var(--text-muted);margin-top:1px}

/* ACTIONS CELL */
.actions-cell{display:flex;gap:3px;justify-content:flex-end}

/* EMPTY */
.empty-state{text-align:center;padding:32px;color:var(--text-muted);font-size:13px}
/* CALENDAR */
.cal-cell{min-height:42px;padding:2px;border-radius:3px;background:var(--bg-card);border:1px solid var(--border-light);position:relative;display:flex;flex-direction:column;gap:2px}
.cal-cell.cal-today{border-color:var(--gold);background:#FFFBF0}
.cal-cell.cal-empty{background:transparent;border-color:transparent}
.cal-day{font-size:11px;font-weight:700;color:var(--text-muted);padding:1px 3px}
.cal-today .cal-day{color:var(--gold)}
.cal-evt{font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-evt-inicio{background:#DCFCE7;color:#166534}
.cal-evt-fim{background:#FEE2E2;color:#991B1B}
/* CHAT */
.chat-msg{max-width:85%;padding:8px 11px;border-radius:10px;font-size:12px;line-height:1.5;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chat-bot{background:var(--bg-card);border:1px solid var(--border-light);align-self:flex-start;border-radius:0 10px 10px 10px}
.chat-user{background:var(--navy);color:#fff;align-self:flex-end;border-radius:10px 0 10px 10px}
.chat-time{font-size:10px;color:var(--text-muted);align-self:flex-end;margin-top:-4px}
.chat-sugg{background:var(--bg);border:1px solid var(--border-light);border-radius:12px;padding:3px 9px;font-size:11px;cursor:pointer;color:var(--info);font-family:'Calibri',Calibri,sans-serif;transition:all .15s;white-space:nowrap}
.chat-sugg:hover{background:var(--info-bg);border-color:var(--info)}

/* VISTA UNIFORME 9pt */
.vista-9pt,
.vista-9pt *{
  font-family:'Calibri', Calibri, sans-serif !important;
  font-size:8pt !important;
}

/* FORM OBRAS UNIFORME 8pt */
.form-8pt,
.form-8pt *{
  font-family:'Calibri', Calibri, sans-serif !important;
  font-size:8pt !important;
}
.form-8pt .form-input,
.form-8pt .form-select,
.form-8pt .form-textarea{
  padding:3px 6px !important;
}
.form-8pt .form-input,
.form-8pt .form-select{
  height:22px !important;
  line-height:22px !important;
}
.form-8pt .form-textarea{
  min-height:48px !important;
}
.form-8pt .form-row{
  align-items:end;
}
.form-8pt .form-label{
  font-size:7pt !important;
}

/* FICHA OBRA - BLOCOS COMPACTOS */
.ficha-block{border:1px solid var(--border-light);border-radius:4px;margin-bottom:10px;background:#fff;overflow:hidden}
.ficha-block-title{background:#EEF1F5;border-bottom:1px solid var(--border-light);padding:6px 9px;font-size:7.2pt;font-weight:700;color:#4B5563;text-transform:uppercase;letter-spacing:.7px}
.ficha-kv-grid{display:grid;grid-template-columns:90px 1fr 90px 1fr 90px 1fr}
.ficha-kv-label,.ficha-kv-value,.ficha-kv-empty{padding:6px 9px;border-bottom:1px solid var(--border-light);font-size:8.5pt;display:flex;align-items:center}
.ficha-kv-label{font-size:7.2pt;font-weight:700;color:#4B5563;text-transform:uppercase;letter-spacing:.4px;background:#FAFAFB}
.ficha-kv-value{background:#fff}
.ficha-kv-value.calc{background:#fff;opacity:.88}

.ficha-text-value{background:#fff;padding:8px 10px;min-height:38px;border-bottom:1px solid var(--border-light);font-size:8.5pt;line-height:1.35;white-space:pre-line}
.ficha-text-value:hover,.ficha-kv-value:hover{background:#FFF8E8}

/* INLINE EDIT NAS TABELAS */
.tr-editing{background:rgba(201,146,42,.04)!important}
.tr-editing td{background:rgba(201,146,42,.04)!important}
.ie-inp,.ie-sel{width:100%;height:22px;border:none!important;border-bottom:1px solid var(--border-light)!important;background:transparent!important;box-shadow:none!important;outline:none!important;border-radius:0!important;padding:1px 3px!important;font-family:'Calibri',Calibri,sans-serif!important;font-size:8pt!important;color:var(--text)!important}
.ie-inp:focus,.ie-sel:focus{border-bottom-color:var(--gold)!important;background:rgba(201,146,42,.05)!important}
.ie-sel{appearance:none;cursor:pointer}

.obras-dd{position:relative;width:100%}
.obras-dd-btn{width:100%;height:22px;border:none;border-bottom:1px solid var(--border-light);background:transparent;font-family:'Calibri',Calibri,sans-serif;font-size:8pt;color:var(--text);text-align:left;padding:1px 18px 1px 3px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.obras-dd-btn::after{content:'▾';position:absolute;right:6px;top:3px;color:var(--text-muted)}
.obras-dd-menu{display:none;position:absolute;z-index:50;top:24px;left:0;width:260px;max-height:180px;overflow:auto;background:#fff;border:1px solid var(--border-light);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.obras-dd-opt{display:flex;align-items:center;gap:6px;padding:5px 7px;font-size:8pt;cursor:pointer}
.obras-dd-opt:hover{background:var(--bg)}

.intv-groups-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.intv-line{display:grid;grid-template-columns:minmax(90px,1.3fr) minmax(105px,1fr) minmax(170px,2fr) minmax(85px,1fr);column-gap:8px;align-items:center;min-height:20px;font-size:7.6pt}
.intv-nome,.intv-contacto,.intv-email,.intv-role{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.intv-nome{font-weight:700}
.intv-contacto{color:#1A7A4A}
.intv-email{color:#1B4F9B}
.intv-role{color:#6B7280}
.table-docs th:nth-child(1),.table-docs td:nth-child(1){width:70px;text-align:center}
.table-docs th:nth-child(2),.table-docs td:nth-child(2){width:70px}
.table-docs th:nth-child(3),.table-docs td:nth-child(3){width:250px}
.table-docs th:nth-child(4),.table-docs td:nth-child(4){width:130px;text-align:center}
.table-docs th:nth-child(5),.table-docs td:nth-child(5){width:80px;text-align:center}
.table-docs th:nth-child(6),.table-docs td:nth-child(6){width:80px;text-align:center}
.table-docs th:nth-child(7),.table-docs td:nth-child(7){width:70px}

.table-intervenientes-fixed{width:100%;table-layout:fixed}

  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  height:20px !important;
  line-height:20px !important;
  padding:0 8px !important;
  font-size:8.5pt !important;
  vertical-align:middle !important;
}
.docs-status-cell{
  line-height:32px !important;
  white-space:nowrap !important;
}
.docs-status-cell .doc-status{
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  height:20px !important;
  line-height:20px !important;
  font-size:8.5pt !important;
  vertical-align:middle !important;
}

/* =========================================================
   SID — uniformização real da altura das linhas
   (bloco final, ganha prioridade sobre regras anteriores)
   ========================================================= */
.sid-table{
  table-layout:fixed !important;
  border-collapse:collapse !important;
}
.sid-table thead tr,
.sid-table th{
  height:30px !important;
  min-height:30px !important;
  max-height:30px !important;
  line-height:30px !important;
  padding-top:0 !important;
  padding-bottom:0 !important;
  vertical-align:middle !important;
}
.sid-table tbody tr,
.sid-table td{
  height:32px !important;
  min-height:32px !important;
  max-height:32px !important;
  line-height:32px !important;
  padding-top:0 !important;
  padding-bottom:0 !important;
  vertical-align:middle !important;
}
/* impedir que tags/badges aumentem a linha */
.sid-table .obra-tag,
.sid-table .doc-status,
.sid-table .badge,
.sid-table .code-pill{
  height:20px !important;
  min-height:20px !important;
  max-height:20px !important;
  line-height:20px !important;
  padding-top:0 !important;
  padding-bottom:0 !important;
  margin-top:0 !important;
  margin-bottom:0 !important;
  vertical-align:middle !important;
}
/* tudo numa só linha por célula */
.sid-table td{
  white-space:nowrap !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
}
.sid-table td .obra-tag,
.sid-table td .doc-status{
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
}
.docs-status-cell{
  height:32px !important;
  min-height:32px !important;
  max-height:32px !important;
  line-height:32px !important;
  white-space:nowrap !important;
  overflow:hidden !important;
}

</style>

<script>
// ================================================================
// XLSX EXPORT — uses SheetJS via CDN
// ================================================================
function loadSheetJS(cb){
  if(window.XLSX){cb();return;}
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  s.onload=cb; document.head.appendChild(s);
}

function exportXLSX(data, filename, headers){
  loadSheetJS(()=>{
    const rows=data.map(r=>headers.map(h=>r[h.key]??''));
    const ws=XLSX.utils.aoa_to_sheet([headers.map(h=>h.label),...rows]);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Dados');
    XLSX.writeFile(wb,filename+'.xlsx');
  });
}

let importTarget='', importSubTarget='';
function _ensureImportModal(){
  let el=document.getElementById('import-modal');
  if(el)return el;
  el=document.createElement('div');
  el.id='import-modal';
  el.style.cssText='position:fixed;inset:0;background:rgba(30,58,95,.55);display:none;align-items:center;justify-content:center;z-index:9998;font-family:Calibri,sans-serif';
  el.innerHTML=`
    <div style="background:#fff;border-radius:6px;width:480px;max-width:92vw;box-shadow:0 8px 32px rgba(15,23,42,.25);overflow:hidden">
      <div style="background:var(--navy);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center">
        <div id="import-title" style="font-size:13px;font-weight:700">Importar XLSX</div>
        <button onclick="closeImport()" style="background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1">×</button>
      </div>
      <div style="padding:16px">
        <div style="font-size:11.5pt;color:var(--text-muted);margin-bottom:10px">Selecione um ficheiro <strong>.xlsx</strong> com as colunas esperadas (Nome, Mail, Contacto, Função, Role, Ativo para Intervenientes). Linhas com coluna <code>id</code> atualizam registos existentes; sem <code>id</code> criam novos. <strong>Nada é apagado.</strong></div>
        <input type="file" id="import-file" accept=".xlsx,.xls" onchange="doImport()" style="width:100%;padding:6px;border:1px solid var(--border-light);border-radius:4px;font-size:8.5pt">
        <div id="import-preview" style="margin-top:10px;font-size:11pt;min-height:18px"></div>
      </div>
      <div style="padding:10px 16px;background:#f4f6f9;display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-outline" onclick="closeImport()">Cancelar</button>
        <button class="btn btn-gold" onclick="doImport()">Carregar</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  return el;
}
function openImport(target, sub=''){
  importTarget=target;
  importSubTarget=sub;
  _ensureImportModal();
  const labels={obras:'Obras',subempreiteiros:'Subempreiteiros',especialidades:'Especialidades',utilizadores:'Utilizadores/Intervenientes',tipos_doc:'Tipos de Documento'};
  const subLabels={principal:'Principal',infos:'Infos'};
  let title='Importar XLSX — '+(labels[target]||target);
  if(sub) title+=' — '+(subLabels[sub]||sub);
  document.getElementById('import-title').textContent=title;
  document.getElementById('import-file').value='';
  document.getElementById('import-preview').innerHTML='';
  // restaurar botão para estado inicial
  const btn=document.querySelector('#import-modal .btn-gold');
  if(btn){btn.textContent='Carregar';btn.onclick=doImport;}
  window._importRows=null;
  document.getElementById('import-modal').style.display='flex';
}
function closeImport(){ document.getElementById('import-modal').style.display='none'; }
function doImport(){
  const f=document.getElementById('import-file').files[0];
  if(!f){alert('Selecione um ficheiro.');return;}
  loadSheetJS(()=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws);
        document.getElementById('import-preview').innerHTML=`<span style="color:var(--success)">${rows.length} linha(s) lidas. Clique em Importar para confirmar.</span>`;
        window._importRows=rows;
        // Mudar botão para confirmar
        const btn=document.querySelector('#import-modal .btn-gold');
        if(btn){btn.textContent='Confirmar Importação';btn.onclick=confirmImport;}
      }catch(err){
        document.getElementById('import-preview').innerHTML=`<span style="color:var(--danger)">Erro ao ler ficheiro: ${err.message}</span>`;
      }
    };
    reader.readAsArrayBuffer(f);
  });
}

async function confirmImport(){
  const rows=window._importRows;
  if(!rows||!rows.length){alert('Nenhuma linha para importar.');return;}
  const target=importTarget;
  const sub=importSubTarget;

  const gr=(row,...keys)=>{
    for(const k of keys){if(row[k]!=null&&String(row[k]).trim()!=='')return String(row[k]).trim();}
    return '';
  };
  const gN=(row,...keys)=>{const v=gr(row,...keys);return v!==''?Number(v):null;};

  // Converter texto → boolean para campos Validade/Versão
  const toBool=v=>{
    if(v==null||v==='')return false;
    const s=String(v).trim().toLowerCase();
    return ['true','sim','s','x','✔','✓','1'].includes(s)||v===1||v===true;
  };

  showLoadingOverlay('A importar...');
  let ok=0,erros=0;
  try{
    for(const row of rows){
      try{
        let obj={};
        if(target==='obras'&&sub==='principal'){
          obj={
            id:row.id||uid(),
            codigo:gr(row,'Código','Codigo','codigo'),sigla:gr(row,'Sigla','sigla'),
            estado:gr(row,'Estado','estado')||'Em Preparação',nome:gr(row,'Nome','nome'),
            morada:gr(row,'Morada','morada'),codigo_postal:gr(row,'Código Postal','codigoPostal'),
            localidade:gr(row,'Localidade','localidade'),
            tipo_obra:gr(row,'Tipo','tipoObra'),subtipo:gr(row,'Subtipo','subtipo'),
            area:gN(row,'Área','Area','area'),
            pisos_acima:gN(row,'Piso +','pisosAcima'),pisos_abaixo:gN(row,'Piso -','pisosAbaixo'),
            ambito:gr(row,'Âmbito','Ambito','ambito'),
            principais_desafios:gr(row,'Principais Desafios','principaisDesafios'),
          };
        } else if(target==='obras'&&sub==='infos'){
          obj={
            id:row.id||uid(),
            codigo:gr(row,'Código','Codigo','codigo'),sigla:gr(row,'Sigla','sigla'),nome:gr(row,'Nome','nome'),
            valor_obra:gN(row,'Valor Obra','valorObra'),
            inicio_previsto:gr(row,'Início Previsto','inicioPrevisto')||null,
            inicio_real:gr(row,'Início Real','inicioReal')||null,
            fim_previsto:gr(row,'Fim Previsto','fimPrevisto')||null,
          };
        } else if(target==='obras'){
          obj={id:row.id||uid(),codigo:gr(row,'Código','Codigo','codigo'),sigla:gr(row,'Sigla','sigla'),nome:gr(row,'Nome','nome'),estado:gr(row,'Estado','estado')||'Em Preparação'};
        } else if(target==='tipos_doc'){
          const cod=gr(row,'Código','Codigo','codigo');
          const nome=gr(row,'Nome','nome');
          if(!cod&&!nome)continue;
          const temValidade=toBool(gr(row,'Validade','validade'));
          const temVersao=toBool(gr(row,'Versão','Versao','versao'));
          const isDefault=toBool(gr(row,'Default','default'));
          obj={
            id:row.id||uid(),
            codigo:cod,
            nome:nome,
            fase:gr(row,'Fase','fase')||null,
            temValidade,
            temVersao,
            isDefault,
            // campos Supabase (snake_case)
            tem_validade:temValidade,
            tem_versao:temVersao,
            is_default:isDefault,
          };
        } else if(target==='especialidades'){
          const cod=gr(row,'Código','Codigo','codigo');
          const nome=gr(row,'Nome','nome');
          if(!cod&&!nome)continue;
          obj={id:row.id||uid(),codigo:cod,nome:nome};
        } else if(target==='subempreiteiros'){
          const nome=gr(row,'Nome','nome');
          if(!nome)continue;
          obj={
            id:row.id||uid(),nome:nome,
            especialidade:gr(row,'Especialidade','especialidade'),
            responsavel:gr(row,'Responsável','Responsavel','responsavel'),
            email:gr(row,'Mail','Email','email'),
            contacto:gr(row,'Contacto','contacto'),
          };
        } else if(target==='utilizadores'){
          const nome=gr(row,'Nome','nome');
          if(!nome)continue;
          obj={
            id:row.id||uid(),nome:nome,
            email:gr(row,'Mail','Email','email'),
            contacto:gr(row,'Contacto','contacto'),
            funcao:gr(row,'Função','Funcao','funcao'),
            role:gr(row,'Role','role')||'fiscalizacao',
            ativo:toBool(gr(row,'Ativo','ativo'))||true,
          };
        } else {
          obj={...row,id:row.id||uid()};
        }
        if(row.id){
          try{await sb.patch(target,row.id,obj);}
          catch(e){await sb.post(target,obj);}
        } else {
          // Fallback: tentar match por chave natural antes de criar
          let matchId=null;
          if(target==='utilizadores' && obj.email){
            const u=DB.utilizadores.find(x=>(x.email||'').toLowerCase()===(obj.email||'').toLowerCase());
            if(u)matchId=u.id;
          } else if(target==='especialidades' && obj.codigo){
            const e=DB.especialidades.find(x=>(x.codigo||'').toLowerCase()===(obj.codigo||'').toLowerCase());
            if(e)matchId=e.id;
          } else if(target==='tipos_doc' && obj.codigo){
            const t=DB.tiposDoc.find(x=>(x.codigo||'').toLowerCase()===(obj.codigo||'').toLowerCase());
            if(t)matchId=t.id;
          } else if(target==='subempreiteiros' && obj.nome){
            const s=DB.subempreiteiros.find(x=>(x.nome||'').toLowerCase()===(obj.nome||'').toLowerCase());
            if(s)matchId=s.id;
          } else if(target==='obras' && obj.codigo){
            const o=DB.obras.find(x=>(x.codigo||'').toLowerCase()===(obj.codigo||'').toLowerCase());
            if(o)matchId=o.id;
          }
          if(matchId){
            const patchObj={...obj}; delete patchObj.id;
            await sb.patch(target,matchId,patchObj);
          } else {
            await sb.post(target,obj);
          }
        }
        ok++;
      }catch(e){erros++;console.error('Erro linha:',row,e);}
    }
    hideLoadingOverlay();
    closeImport();
    await loadDB();
    render();
    showToast(`Importação concluída: ${ok} linha(s)${erros?', '+erros+' erro(s)':''} ✓`);
  }catch(e){
    hideLoadingOverlay();
    showToast('Erro na importação: '+e.message,'danger');
  }
}

// Supabase client (using REST API directly — no npm needed)
const sb = {
  async get(table, filters='') {
    const query = filters ? `?${filters}` : '';
    const r = await fetch(`${SUPA.url}/rest/v1/${table}${query}`, {
      headers: {'apikey': SUPA.key, 'Authorization': `Bearer ${SUPA.key}`}
    });
    if (!r.ok) {
      const txt = await r.text();
      throw new Error(`GET ${table} failed: ${r.status} ${txt}`);
    }
    return r.json();
  },
  async post(table, data) {
    const r = await fetch(`${SUPA.url}/rest/v1/${table}`, {
      method: 'POST',
      headers: {'apikey': SUPA.key, 'Authorization': `Bearer ${SUPA.key}`,
        'Content-Type': 'application/json', 'Prefer': 'return=representation'},
      body: JSON.stringify(data)
    });
    if (!r.ok) { const e = await r.text(); throw new Error(`POST ${table}: ${e}`); }
    return r.json();
  },
  async patch(table, id, data) {
    const r = await fetch(`${SUPA.url}/rest/v1/${table}?id=eq.${id}`, {
      method: 'PATCH',
      headers: {'apikey': SUPA.key, 'Authorization': `Bearer ${SUPA.key}`,
        'Content-Type': 'application/json', 'Prefer': 'return=representation'},
      body: JSON.stringify(data)
    });
    if (!r.ok) { const e = await r.text(); throw new Error(`PATCH ${table}: ${e}`); }
    return r.json();
  },
  async delete(table, id) {
    const r = await fetch(`${SUPA.url}/rest/v1/${table}?id=eq.${id}`, {
      method: 'DELETE',
      headers: {'apikey': SUPA.key, 'Authorization': `Bearer ${SUPA.key}`}
    });
    if (!r.ok) throw new Error(`DELETE ${table} failed: ${r.status}`);
    return true;
  },
  async upload(bucket, path, file) {
    if(file && file.size>MAX_UPLOAD_BYTES){
      const mb=(file.size/1024/1024).toFixed(1);
      throw new Error(`Ficheiro demasiado grande (${mb} MB). Máximo: ${MAX_UPLOAD_MB} MB.`);
    }
    const r = await fetch(`${SUPA.url}/storage/v1/object/${bucket}/${path}`, {
      method: 'POST',
      headers: {'apikey': SUPA.key, 'Authorization': `Bearer ${SUPA.key}`,
        'Content-Type': file.type||'application/octet-stream',
        'x-upsert': 'true'},
      body: file,
    });
    if (!r.ok) { const e = await r.text(); throw new Error(`Upload ${path}: ${e}`); }
    return `${SUPA.url}/storage/v1/object/public/${bucket}/${path}`;
  },
  publicUrl(bucket, path){
    return `${SUPA.url}/storage/v1/object/public/${bucket}/${path}`;
  },
};

// Map Supabase column names to local DB field names
function mapObra(r) {
  return {
    id: r.id, codigo: r.codigo, sigla: r.sigla, nome: r.nome, estado: r.estado||'Em Preparação',
    morada: r.morada, codigoPostal: r.codigo_postal, localidade: r.localidade,

    pisosAcima: r.pisos_acima, pisosAbaixo: r.pisos_abaixo,
    ambito: r.ambito, principaisDesafios: r.principais_desafios,

    relMensal: r.rel_mensal===true,

    intervenientes_emp: r.intervenientes_emp||[], intervenientes_proj: r.intervenientes_proj||[],
  };
}
function mapUtil(r) {
  console.log('mapUtil raw from Supabase:', r.email, 'pwd_hash:', r.pwd_hash, 'ativo:', r.ativo);
  const parseArr=(v)=>{if(typeof v==='string'){try{const j=JSON.parse(v);return Array.isArray(j)?j:[];}catch(e){return [];}}return Array.isArray(v)?v:[];};
  const parseObj=(v)=>{if(typeof v==='string'){try{const j=JSON.parse(v);return (j&&typeof j==='object'&&!Array.isArray(j))?j:{};}catch(e){return {};}}return (v&&typeof v==='object'&&!Array.isArray(v))?v:{};};
  return {
    id: r.id, nome: r.nome, email: r.email, contacto: r.contacto||'', funcao: r.funcao||'',
    role: r.role||'fiscalizacao', obras: (()=>{let o=r.obras||[];if(typeof o==='string'){try{o=JSON.parse(o);}catch(e){o=[];}}return Array.isArray(o)?o:[];})(), ativo: r.ativo!==false,
    pwd: r.pwd||'', pwd_hash: r.pwd_hash||'', apps: r.apps||['sid'], foto: r.foto||'',
    especialidades: parseArr(r.especialidades),
    obras_especialidades: parseObj(r.obras_especialidades),
  };
}

let dbLoaded = false;
async function loadDB() {
  console.log('loadDB called, SUPA.url:', SUPA.url);
  showLoadingOverlay('A carregar dados...');
  try {
    // Load each table independently so one failure doesn't block the rest
    const safe = async (table) => { try { const d=await sb.get(table); console.log('Loaded '+table+':', d.length,'rows'); return d; } catch(e) { console.error('FAILED to load '+table+':', e.message); return []; }};
    const withTimeout = (p, ms=15000) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timeout ao carregar dados')),ms))]);
    const [obras, utils, subs, esps, tdocs, audit] = await withTimeout(Promise.all([
      safe('obras'),
      safe('utilizadores'),
      safe('subempreiteiros'),
      safe('especialidades'),
      safe('tipos_doc'),
      safe('auditoria'),
    ]));
    if(!utils || utils.length === 0){
      dbLoaded = false;
      throw new Error('Não foi possível carregar utilizadores do Supabase.');
    }
    DB.obras = obras.map(mapObra);
    DB.utilizadores = utils.map(mapUtil);
    DB.subempreiteiros = subs;
    DB.especialidades = esps;
    DB.tiposDoc = (tdocs||[]).map(r=>({
      id:r.id, codigo:r.codigo, sigla:r.sigla||'', nome:r.nome,
      fase:r.fase||null,
      temValidade:r.tem_validade!==false,
      temVersao:r.tem_versao!==false,
      isDefault:r.is_default===true,
    }));

// Simple hash function (djb2 + salt) — not cryptographic but obfuscated
function hashPwd(pwd){
  const salted = 'aceitar_sid_2026_'+pwd+'_salt';
  let h=5381;
  for(let i=0;i<salted.length;i++) h=((h<<5)+h)+salted.charCodeAt(i);
  return (h>>>0).toString(16).padStart(8,'0');
}

const GITHUB_REPO = 'CarSanFer/sid-aceitar';
const GITHUB_FILE = 'index.html';

async function deployToGitHub(input) {
  const file = input?.files?.[0];
  if (!file) return;
  const btn = document.getElementById('btn-deploy');
  const origText = btn.innerHTML;
  btn.innerHTML = '⏳ A fazer deploy...';

  let token = localStorage.getItem('gh_token');
  if (!token) {
    token = prompt('GitHub Personal Access Token (scope: repo):');
    if (!token) { btn.innerHTML = origText; return; }
    localStorage.setItem('gh_token', token.trim());
  }

  try {
    const text = await file.text();
    // Encoding robusto para ficheiros grandes
    const bytes = new TextEncoder().encode(text);
    let binary = '';
    const chunkSize = 8192;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
    }
    const encoded = btoa(binary);

    const getResp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
    });
    const existing = getResp.ok ? await getResp.json() : null;
    const sha = existing?.sha;

    const putResp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Deploy SID — ${new Date().toLocaleString('pt-PT')}`,
        content: encoded,
        ...(sha ? { sha } : {})
      })
    });
    if (!putResp.ok) {
      const err = await putResp.json();
      if (err.message?.includes('credentials') || err.message?.includes('token')) {
        localStorage.removeItem('gh_token');
      }
      throw new Error(err.message || 'Erro no deploy');
    }
    btn.innerHTML = '✅ Deployed!';
    setTimeout(() => { btn.innerHTML = origText; }, 3000);
  } catch(e) {
    alert('Erro no deploy: ' + e.message);
    localStorage.removeItem('gh_token');
    btn.innerHTML = origText;
  }
}

// Inline edit intervenientes
function startUtilEdit(id){editingUtilId=id;renderTabelas(document.getElementById('app'));}
function cancelUtilEdit(){editingUtilId=null;renderTabelas(document.getElementById('app'));}
async function saveUtilEdit(id){
  const u=DB.utilizadores.find(x=>String(x.id)===String(id));
  if(!u){editingUtilId=null;return;}
  document.querySelectorAll(`.ie-inp[data-util="${id}"]`).forEach(el=>{
    u[el.dataset.field]=el.value;
  });
  document.querySelectorAll(`.ie-sel[data-util="${id}"]`).forEach(el=>{
    if(el.classList.contains('obras-ms')) return;
    const v=el.value;
    u[el.dataset.field]=v==='true'?true:v==='false'?false:v;
  });
  const obrasChecks=document.querySelectorAll(`.obras-cb[data-util="${id}"]:checked`);
  u.obras=Array.from(obrasChecks).map(cb=>String(cb.value));
  // Para projetistas, função é sempre "Projetista"
  if(u.role==='projetista') u.funcao='Projetista';
  // Limpar obras_especialidades de obras já não associadas (ou todas se já não é projetista)
  if(u.role==='projetista'){
    const oe=u.obras_especialidades||{};
    Object.keys(oe).forEach(k=>{ if(!u.obras.includes(k)) delete oe[k]; });
    u.obras_especialidades=oe;
  } else {
    u.obras_especialidades={};
  }
  editingUtilId=null;
  try{
    await sb.patch('utilizadores',id,{
      nome:u.nome,email:u.email,contacto:u.contacto||'',
      funcao:u.funcao||'',role:u.role,ativo:u.ativo,obras:u.obras||[],
      especialidades:u.especialidades||[],
      obras_especialidades:u.obras_especialidades||{}
    });
    auditLog('Utilizador',u.nome,'editado','inline edit');
    showToast('Guardado ✓');
  }catch(e){showToast('Erro: '+e.message,'danger');}
  renderTabelas(document.getElementById('app'));
}
function normId(v){return String(v??'').trim();}
function getObrasDoUtil(u){
  const refs=(u.obras||[]).map(normId);
  return DB.obras.filter(o=>refs.includes(normId(o.id))||refs.includes(normId(o.codigo))||refs.includes(normId(o.sigla)));
}
function fieldForUtil(u){
  const role=normId(u.role).toLowerCase();
  if(role==='dono_obra'||role==='dono de obra') return 'intervenientes_do';
  if(role==='projetista'||role==='projetistas') return 'intervenientes_proj';
  if(role==='empreiteiro'||role==='empreiteiros') return 'intervenientes_emp';
  if(role==='equipa_obra'||role==='equipa obra') return 'intervenientes_eq';
  return 'intervenientes_fisc';
}

window.guardarAssocObras=async function(uid){
  const u=DB.utilizadores.find(x=>normId(x.id)===normId(uid));
  if(!u)return;
  const selected=Array.from(document.querySelectorAll('.cb-assoc-obra:checked')).map(x=>normId(x.value));
  try{

  };
  window.addChatMsg=function(txt,who){
    const box=document.getElementById('chat-msgs');
    if(!box)return;
    const d=document.createElement('div');
    d.className='chat-msg chat-'+who;
    d.textContent=txt;
    box.appendChild(d);
    box.scrollTop=box.scrollHeight;
  };
  window.chatAnswer=function(q){
    const ql=q.toLowerCase();
    const obras=getObrasVisiveis();
    // Em curso
    if(ql.includes('em curso')||ql.includes('quantas obras')||ql.includes('ativas')){
      const ec=obras.filter(o=>o.estado==='Em Curso');
      return `Há ${ec.length} obra(s) em curso: ${ec.map(o=>o.sigla+' — '+o.nome).join(', ')}.`;
    }
    // Suspensas
    if(ql.includes('suspens')){
      const s=obras.filter(o=>o.estado==='Suspensa');
      return s.length?`Obras suspensas: ${s.map(o=>o.sigla+' — '+o.nome).join(', ')}.`:'Não há obras suspensas.';
    }
    // Concluídas
    if(ql.includes('conclu')){
      const c=obras.filter(o=>o.estado==='Concluída');
      return `${c.length} obra(s) concluída(s): ${c.map(o=>o.sigla).join(', ')}.`;
    }
    // Fiscal de obra
    if(ql.includes('fiscal')){
      const sigla=obras.find(o=>ql.includes(o.sigla.toLowerCase())||ql.includes(o.nome.toLowerCase()));
      if(sigla){
        const fisc=DB.utilizadores.filter(u=>(u.role==='fiscalizacao'||u.role==='superadmin')&&Array.isArray(u.obras)&&u.obras.includes(sigla.id));
        return fisc.length?`Fiscalização da obra ${sigla.sigla}: ${fisc.map(u=>u.nome+(u.funcao?' ('+u.funcao+')':'')).join(', ')}.`:`Nenhuma fiscalização associada à obra ${sigla.sigla}.`;
      }
      return 'Pode especificar a sigla ou nome da obra?';
    }
    // Valor
    if(ql.includes('valor')||ql.includes('total')){
      const total=obras.filter(o=>o.valorObra).reduce((s,o)=>s+(o.valorObra||0),0);
      return `O valor total das obras visíveis é ${total.toLocaleString('pt-PT')}€.`;
    }
    // Obra específica
    const obra=obras.find(o=>ql.includes(o.sigla.toLowerCase())||ql.includes(o.nome.toLowerCase())||ql.includes(o.codigo.toLowerCase()));
    if(obra){
      return `Obra ${obra.sigla} — ${obra.nome}: estado ${obra.estado}, localidade ${obra.localidade||'não definida'}, valor ${obra.valorObra?obra.valorObra.toLocaleString('pt-PT')+'€':'não definido'}, fim previsto ${obra.fimPrevisto||'não definido'}.`;
    }
    // Quantos utilizadores
    if(ql.includes('utilizador')||ql.includes('user')){
      return `Há ${DB.utilizadores.filter(u=>u.ativo).length} utilizadores activos.`;
    }
    // Ajuda
    if(ql.includes('ajuda')||ql.includes('help')||ql.includes('o que')){
      return 'Posso responder a perguntas como: "quantas obras em curso?", "quem é o fiscal da obra AB?", "qual o valor total das obras?", "estado da obra Gripark".';
    }
    return 'Não encontrei informação para essa questão. Tente perguntar sobre obras específicas (pela sigla ou nome), fiscalização, valores ou estados.';
  };
}

  obras=[...obras].sort((a,b)=>{const v=k=>a[k]??'',vb=k=>b[k]??'';return String(v(obrasSort.key)).localeCompare(String(vb(obrasSort.key)),'pt',{numeric:true})*obrasSort.dir;});

  let thead='',rows='';

      ${TH(110,'localidade','Localidade')}
      ${TH(100,'estado','Estado')}

        const fa=String(a.fase||'').trim().toLowerCase();
        const fb=String(b.fase||'').trim().toLowerCase();
        return (ordem[fa]||9)-(ordem[fb]||9) || String(a.codigo||a.nome||'').localeCompare(String(b.codigo||b.nome||''),'pt',{numeric:true});
      });
    const docExiste=(o,t)=>{
      const docs=o.docs||[];
      return docs.some(d=>{
        const tipo=String(d.tipo||'');
        const cod=String(d.codigo||'');
        const nome=String(d.nome||d.titulo||'');
        return tipo===String(t.id)||tipo===String(t.codigo)||cod===String(t.codigo)||nome===String(t.nome);

    const docsObrigatorios=o=>{
      if(!tiposObrigatorios.length) return '—';

        <td style="text-align:center"><strong>${fmt(o.sigla)}</strong></td>

    }).join('');
  } else {
    thead=`<tr><th>Código</th><th>Nome</th></tr>`;

  app.innerHTML=`

        <input class="sid-search" placeholder="Pesquisar..." value="${obrasSearch}" oninput="obrasSearch=this.value.toLowerCase();render()">

      ${canEdit()?`<button class="sid-btn sid-btn-main" onclick="modalNovaObra()">+ Obra</button>`:''}
    </div>
  </div>
  <div class="table-card">
    <div class="table-wrap"><table class="sid-table"><thead>${thead}</thead>
    <tbody>${rows||'<tr><td colspan="21" class="empty-state">Nenhum resultado</td></tr>'}</tbody></table></div>

function exportObras(){
  const obras=getObrasVisiveis();
  const rows=obras.map(o=>{
    const prrs=o.prorrogacoes||[];
    let desvAcum=0;
    prrs.forEach((p,i)=>{const pf=i===0?o.fimPrevisto:(prrs[i-1]?.novoFim||o.fimPrevisto);const d=diffDays(pf,p.novoFim);if(d!=='')desvAcum+=Number(d);});
    return {
      codigo:o.codigo,sigla:o.sigla,nome:o.nome,estado:o.estado,
      morada:o.morada,codigoPostal:o.codigoPostal,localidade:o.localidade,
      tipoObra:o.tipoObra,subtipo:o.subtipo,area:o.area,
      pisosAcima:o.pisosAcima,pisosAbaixo:o.pisosAbaixo,
      valorObra:o.valorObra,inicioPrevisto:o.inicioPrevisto,
      inicioReal:o.inicioReal,fimPrevisto:o.fimPrevisto,
      duracao:diffDays(o.inicioPrevisto,o.fimPrevisto),
      nrProrrogacoes:prrs.length||0,
      ultimoNovoFim:prrs.length?prrs[prrs.length-1].novoFim:'',
      desvioPrevisto:diffDays(o.inicioPrevisto,o.inicioReal),
      desvioAcumulado:prrs.length?desvAcum:'',
      ambito:o.ambito,principaisDesafios:o.principaisDesafios,
    };
  });
  exportXLSX(rows,'SID_Obras',[
    {key:'codigo',label:'Código'},{key:'sigla',label:'Sigla'},{key:'nome',label:'Nome'},
    {key:'estado',label:'Estado'},{key:'morada',label:'Morada'},{key:'codigoPostal',label:'Cód. Postal'},
    {key:'localidade',label:'Localidade'},{key:'tipoObra',label:'Tipo'},{key:'subtipo',label:'Subtipo'},
    {key:'area',label:'Área m²'},{key:'pisosAcima',label:'P+'},{key:'pisosAbaixo',label:'P-'},
    {key:'valorObra',label:'Valor Obra'},{key:'inicioPrevisto',label:'In. Prev.'},
    {key:'inicioReal',label:'In. Real'},{key:'fimPrevisto',label:'Fim Prev.'},
    {key:'duracao',label:'Dur.(dias)'},{key:'nrProrrogacoes',label:'Prorr.'},
    {key:'ultimoNovoFim',label:'Últ. Novo Fim'},{key:'desvioPrevisto',label:'Desv. Iníc.'},
    {key:'desvioAcumulado',label:'Desv. Acum.'},
    {key:'ambito',label:'Âmbito'},{key:'principaisDesafios',label:'Principais Desafios'},
  ]);
}
function exportObrasPrincipal(){ exportObras(); }

        <div class="ficha-kv-label">Fim Previsto</div>

        <span>Prorrogações e Desvios${prrs.length?' ('+prrs.length+')':''}</span>
        ${fichObraEdit?`<button onclick="addProrr()" style="background:none;border:1px solid var(--gold);color:var(--gold);border-radius:3px;padding:2px 8px;font-size:7.2pt;cursor:pointer;font-family:inherit">+ Prorrogação</button>`:''}

        <div class="ficha-kv-label">Dur. Total</div>
        <div class="ficha-kv-value calc">${prrs.length&&durTotal!=='—'?durTotal+' d':'—'}</div>
        <div class="ficha-kv-empty"></div><div class="ficha-kv-empty"></div>
      </div>
    </div>`;

  } else if(fichObraTab==='Intervenientes'){
    // === INTERVENIENTES — 4 grupos em 2x2, só leitura ===
    const hasObra=u=>(u.obras||[]).map(String).includes(String(o.id));
    const linhasFixas=8;

    const grupos={
      dono:{t:'Dono de Obra', lista:DB.utilizadores.filter(u=>u.role==='dono_obra'&&hasObra(u))},
      fisc:{t:'Fiscalização', lista:DB.utilizadores.filter(u=>(u.role==='fiscalizacao'||u.role==='superadmin')&&hasObra(u))},
      equipa:{t:'Equipa de Obra', lista:DB.utilizadores.filter(u=>u.role==='empreiteiro'&&hasObra(u))},
      proj:{t:'Projetistas', lista:DB.utilizadores.filter(u=>u.role==='projetista'&&hasObra(u))},
    };

    const renderPessoaRow=(u)=>{
      if(!u)return `
      <div style="min-height:24px;padding:3px 9px;border-bottom:1px solid var(--border-light);font-size:8pt;color:var(--text-muted);display:flex;align-items:center">&nbsp;</div>`;
      return `
      <div style="min-height:24px;padding:3px 9px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;overflow:hidden">
        <div class="intv-line">
          <div class="intv-nome">${escapeHtml(u.nome||'')}</div>
          <div class="intv-contacto">${escapeHtml(u.contacto||'')}</div>
          <div class="intv-email">${escapeHtml(u.email||'')}</div>
          <div class="intv-role">${escapeHtml(u.funcao||'')}</div>
        </div>
      </div>`;
    };

    const renderGrupo=(g)=>{
      const rows=Array.from({length:linhasFixas},(_,i)=>renderPessoaRow(g.lista[i]));
      const extra=g.lista.length>linhasFixas?`<div style="padding:5px 9px;font-size:7.5pt;color:var(--gold);font-weight:700">+ ${g.lista.length-linhasFixas} interveniente(s)</div>`:'';
      return `<div class="ficha-block" style="margin:0;min-width:0">
        <div class="ficha-block-title">${g.t}</div>
        ${rows.join('')}${extra}
      </div>`;
    };

    body=`<div style="padding:10px 12px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${renderGrupo(grupos.dono)}
        ${renderGrupo(grupos.fisc)}
        ${renderGrupo(grupos.equipa)}
        ${renderGrupo(grupos.proj)}
      </div>
      <div style="font-size:7.5pt;color:var(--text-muted);margin-top:6px">Associação em Configurações → Intervenientes</div>
    </div>`;

  } else if(fichObraTab==='Documentos'){
    // === DOCUMENTOS — 3 colunas (Concurso · Contrato · Obra) com slots em branco ===
    const docs=o.docs||[];
    const tiposMap=Object.fromEntries(DB.tiposDoc.map(t=>[t.id,t]));
    const nomeDoc=d=>escapeHtml((tiposMap[d.tipo]?.nome)||d.tipo||d.titulo||d.nome||'Documento');
    const faseDoc=d=>String(d.fase||'').trim().toLowerCase();

    const renderDocRow=(d,i)=>`
      <div style="display:grid;grid-template-columns:1fr auto auto;gap:7px;min-height:28px;padding:5px 9px;border-bottom:1px solid var(--border-light);align-items:center">
        <div style="font-size:8pt;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nomeDoc(d)}</div>
        ${d.fileUrl
          ?`<a href="${d.fileUrl}" target="_blank" title="${escapeHtml(d.fileName||d.notas||'Abrir documento')}" onclick="event.stopPropagation()" style="color:var(--gold);font-size:13px;text-decoration:none;cursor:pointer">✔</a>`
          :`<span title="${escapeHtml(d.notas||'Documento registado sem ficheiro')}" style="color:var(--gold);font-size:13px">✔</span>`}
        ${canEdit()?`<button class="btn-icon del" style="padding:0 4px" onclick="removeDocObra('${o.id}',${i})">🗑️</button>`:''}
      </div>`;

    const renderEmptySlot=()=>`
      <div style="min-height:28px;padding:5px 9px;border-bottom:1px solid var(--border-light);display:flex;align-items:center">&nbsp;</div>`;

    const renderDefaultSlot=(t)=>`
      <div style="display:grid;grid-template-columns:1fr auto;gap:7px;min-height:28px;padding:5px 9px;border-bottom:1px dashed var(--border-light);align-items:center;cursor:pointer;opacity:.55" onclick="modalAddDocPreset('${o.id}','${t.id}','${t.fase||''}')" title="Clique para adicionar ${escapeHtml(t.nome)}">
        <div style="font-size:8pt;color:var(--text-muted);font-style:italic">${escapeHtml(t.nome)}</div>
        <span style="font-size:12px;color:var(--gold)">＋</span>
      </div>`;

    const docsComIndex=docs.map((d,i)=>({...d,_idx:i}));
    const getFase=f=>docsComIndex.filter(d=>faseDoc(d)===f);
    const defaultsByFase=fase=>{
      const fl=String(fase||'').trim().toLowerCase();
      return DB.tiposDoc.filter(t=>t.isDefault&&String(t.fase||'').trim().toLowerCase()===fl);
    };

    const SLOTS_MIN=10;
    const renderPhaseCol=(titulo,fase)=>{
      const lista=getFase(fase);
      const defaults=defaultsByFase(fase).filter(t=>!lista.some(d=>d.tipo===t.id));
      const filledHtml=lista.map(d=>renderDocRow(d,d._idx)).join('');
      const defaultsHtml=defaults.map(t=>renderDefaultSlot(t)).join('');
      const usedCount=lista.length+defaults.length;
      const emptyCount=Math.max(0,SLOTS_MIN-usedCount);
      const emptyHtml=Array.from({length:emptyCount},()=>renderEmptySlot()).join('');
      return `<div class="ficha-block" style="margin:0;min-width:0">
        <div class="ficha-block-title">${titulo}</div>
        ${filledHtml}${defaultsHtml}${emptyHtml}
      </div>`;
    };

    body=`<div style="padding:10px 12px">
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch">
        ${renderPhaseCol('Concurso','concurso')}
        ${renderPhaseCol('Contrato','contrato')}
        ${renderPhaseCol('Obra','obra')}
      </div>
    </div>`;

  }

  app.innerHTML=`
  <button class="back-btn" onclick="fichObraId=null;go('obras')">← Voltar a Obras</button>
  <div class="page-header">
    <div>
      <div class="page-title"><span class="code-pill" style="font-size:13px">${o.codigo}</span>${o.sigla} — ${o.nome}</div>
      <div style="margin-top:4px">${estadoBadge(o.estado)}</div>
    </div>
    <div class="page-actions">
      ${fichObraTab==='Documentos' && canEdit()?`<button class="btn btn-gold btn-sm" onclick="modalAddDoc('${o.id}')">+ Adicionar Documento</button>`:''}
      ${canEdit()&&fichObraEdit?`<button class="btn btn-gold btn-sm" onclick="saveInlineObra('${o.id}')">✓ Guardar</button><button class="btn btn-outline btn-sm" onclick="fichaProrrBuffer=null;fichObraEdit=false;render()">✕</button>`:''}
      ${canAdmin()?`<button class="btn btn-danger-outline btn-sm" onclick="confirmDel('obra','${o.id}','${o.nome}')">🗑️ Eliminar</button>`:''}
    </div>
  </div>
  <div class="table-card" ondblclick="if(canEdit()&&!fichObraEdit){fichObraEdit=true;render();}">
    <div class="ficha-tabs">${tabs.map(t=>`<div class="ficha-tab ${fichObraTab===t?'active':''}" onclick="fichObraTab='${t}';render()">${t}</div>`).join('')}</div>
    <div class="ficha-body">${body}</div>
  </div>`;
}
window.modalAddDocPreset=function(obraId,tipoId,fase){
  modalAddDoc(obraId);
  // Pré-seleccionar tipo e preencher fase após o modal abrir
  setTimeout(()=>{
    const sel=document.getElementById('nd-tipo');
    if(sel){
      sel.value=tipoId;
      // Disparar onchange para preencher fase e flags
      const t=DB.tiposDoc.find(x=>x.id===tipoId);
      if(t){
        const faseEl=document.getElementById('nd-fase');
        if(faseEl) faseEl.value=t.fase||fase||'';
        const valEl=document.getElementById('nd-val');
        const verEl=document.getElementById('nd-ver');
        if(valEl){valEl.disabled=!t.temValidade;valEl.style.opacity=t.temValidade?'1':'0.4';}
        if(verEl){verEl.disabled=!t.temVersao;verEl.style.opacity=t.temVersao?'1':'0.4';}
      }
    }
  },50);
};

  const body=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:9px">
    <div><label class="form-label">Tipo *</label><select class="form-input" id="nd-tipo" onchange="onNdTipoChange(this)"><option value="">Selecionar...</option>${tipos}</select></div>
    <div><label class="form-label">Data</label><input class="form-input" id="nd-data" type="date"></div>
    <div><label class="form-label">Versão</label><input class="form-input" id="nd-ver" placeholder="ex: 1.0"></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:9px">
    <div><label class="form-label">Fase</label><input class="form-input" id="nd-fase" readonly style="background:var(--bg);color:var(--text-muted)"></div>
    <div><label class="form-label">Validade</label><input class="form-input" id="nd-val" type="date"></div>
    <div><label class="form-label">Notas</label><input class="form-input" id="nd-not" placeholder="Observações"></div>

    <input class="form-input" id="nd-file" type="file" accept="application/pdf" style="padding:3px 6px;cursor:pointer">

  showModal('Adicionar Documento',body,[

window.onNdTipoChange=function(sel){
  const opt=sel.options[sel.selectedIndex];
  const fase=opt.dataset.fase||'';
  const temVal=opt.dataset.val==='1';
  const temVer=opt.dataset.ver==='1';
  const faseEl=document.getElementById('nd-fase');
  const valEl=document.getElementById('nd-val');
  const verEl=document.getElementById('nd-ver');
  if(faseEl){faseEl.value=fase;}
  if(valEl){valEl.disabled=!temVal;valEl.style.opacity=temVal?'1':'0.4';if(!temVal)valEl.value='';}
  if(verEl){verEl.disabled=!temVer;verEl.style.opacity=temVer?'1':'0.4';if(!temVer)verEl.value='';}
};

window.saveAddDoc=async function(obraId){
  const o=DB.obras.find(x=>x.id===obraId);
  if(!o) return;
  const tipo=document.getElementById('nd-tipo')?.value;
  if(!tipo){showToast('Selecione um tipo de documento','danger');return;}
  const fileInput=document.getElementById('nd-file');
  const file=fileInput?.files?.[0];
  let fileUrl=null, fileName=null;
  if(file){
    if(file.size>MAX_UPLOAD_BYTES){
      const mb=(file.size/1024/1024).toFixed(1);
      showToast(`Ficheiro demasiado grande (${mb} MB). Máximo permitido: ${MAX_UPLOAD_MB} MB.`,'danger');
      const status=document.getElementById('nd-upload-status');
      if(status) status.textContent='';
      return;
    }
    const status=document.getElementById('nd-upload-status');
    if(status) status.textContent='A fazer upload...';
    try{
      const ts=Date.now();
      const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const path=`obras/${obraId}/${ts}_${safeName}`;
      const BUCKET='documentos';
      const r=await fetch(`${SUPA.url}/storage/v1/object/${BUCKET}/${path}`,{
        method:'POST',
        headers:{'apikey':SUPA.key,'Authorization':`Bearer ${SUPA.key}`,
          'Content-Type':file.type||'application/pdf','x-upsert':'true'},
        body:file,
      });
      if(!r.ok){
        let errMsg='Erro desconhecido';
        try{const j=await r.json();errMsg=j.message||j.error||JSON.stringify(j);}catch(e2){errMsg=await r.text();}
        throw new Error(`[${r.status}] ${errMsg} (bucket: ${BUCKET})`);
      }
      fileUrl=`${SUPA.url}/storage/v1/object/public/${BUCKET}/${path}`;
      fileName=file.name;
      if(status) status.textContent=`✓ ${file.name}`;
    }catch(e){
      showToast('Erro no upload: '+e.message,'danger');
      console.error('Upload error:',e);
      return;
    }
  }
  o.docs=o.docs||[];
  o.docs.push({
    tipo,
    fase:document.getElementById('nd-fase')?.value||null,  // herdado do tipo
    data:document.getElementById('nd-data')?.value||null,
    versao:document.getElementById('nd-ver')?.value||null,
    validade:document.getElementById('nd-val')?.value||null,
    notas:document.getElementById('nd-not')?.value||null,
    fileUrl, fileName,
  });
  try{
    await sb.patch('obras',obraId,{docs:o.docs});
    showToast('Documento adicionado ✓');
    closeModal();
    render();
  }catch(e){showToast('Erro: '+e.message,'danger');}
};

window.removeDocObra=async function(obraId,idx){
  const o=DB.obras.find(x=>x.id===obraId);
  if(!o) return;
  o.docs=(o.docs||[]).filter((_,i)=>i!==idx);
  try{
    await sb.patch('obras',obraId,{docs:o.docs});
    showToast('Removido ✓');
    render();
  }catch(e){showToast('Erro: '+e.message,'danger');}
};

window.toggleInterv=function(obraId,dataKey,userId,checked){
  const o=DB.obras.find(x=>x.id===obraId);
  if(!o) return;
  o[dataKey]=o[dataKey]||[];
  if(checked && !o[dataKey].includes(userId)) o[dataKey].push(userId);
  if(!checked) o[dataKey]=o[dataKey].filter(x=>x!==userId);
};

window.saveIntervObra=async function(obraId){
  const o=DB.obras.find(x=>x.id===obraId);
  if(!o) return;
  // Releitura dos checkboxes no DOM
  document.querySelectorAll('[data-intv]').forEach(el=>{
    const key=el.dataset.intv;
    o[key]=o[key]||[];
    if(el.checked && !o[key].includes(el.value)) o[key].push(el.value);
    if(!el.checked) o[key]=o[key].filter(x=>x!==el.value);
  });
  // Dedup
  ['intervenientes_do','intervenientes_fisc','intervenientes_emp','intervenientes_proj'].forEach(k=>{
    o[k]=[...new Set(o[k]||[])];
  });
  fichObraEdit=false;
  try{
    await sb.patch('obras',obraId,{
      intervenientes_do:o.intervenientes_do,
      intervenientes_fisc:o.intervenientes_fisc,
      intervenientes_emp:o.intervenientes_emp,
      intervenientes_proj:o.intervenientes_proj,
    });
    auditLog('Obra',o.nome,'intervenientes editados','inline');
    showToast('Intervenientes guardados ✓');
  }catch(e){showToast('Erro: '+e.message,'danger');}
  render();
};

async function saveInlineObra(id){
  const o=DB.obras.find(x=>x.id===id);
  if(!o)return;
  const g=i=>document.getElementById(i)?.value??null;
  const gN=i=>{const v=document.getElementById(i)?.value;return v!==''&&v!=null?parseFloat(v):null;};
  const gI=i=>{const v=document.getElementById(i)?.value;return v!==''&&v!=null?parseInt(v):null;};
  const updated={
    nome:g('fi-nom')||o.nome,
    sigla:g('fi-sig')||o.sigla,
    codigo:g('fi-cod')||o.codigo,
    morada:g('fi-mor')??o.morada,
    codigoPostal:g('fi-cp')??o.codigoPostal,
    localidade:g('fi-loc')??o.localidade,
    area:gN('fi-area')??o.area,
    estado:g('fi-est')||o.estado,
    tipoObra:g('fi-tip')??o.tipoObra,
    subtipo:g('fi-sub')??o.subtipo,
    pisosAcima:gI('fi-pa')??o.pisosAcima,
    pisosAbaixo:gI('fi-pb')??o.pisosAbaixo,
    ambito:g('fi-amb')??o.ambito,
    principaisDesafios:g('fi-des')??o.principaisDesafios,
    dataConsignacao:g('fi-dat')||o.dataConsignacao,
    valorObra:gN('fi-valo')??o.valorObra,
    inicioPrevisto:g('fi-inp')||o.inicioPrevisto,
    inicioReal:g('fi-inr')||o.inicioReal,
    fimPrevisto:g('fi-fip')||o.fimPrevisto,
    relMensal:document.getElementById('fi-relmensal')?(document.getElementById('fi-relmensal').value==='sim'):o.relMensal,
    empresaDonoObra:g('fi-emp-dono')??o.empresaDonoObra,
    empresaEmpreiteiro:g('fi-emp-emp')??o.empresaEmpreiteiro,
  };
  Object.assign(o,updated);
  // Commit do buffer de prorrogações (se foi editado)
  if(fichaProrrBuffer!==null){
    o.prorrogacoes=fichaProrrBuffer;
    fichaProrrBuffer=null;
  }
  fichObraEdit=false;
  try{
    await sb.patch('obras',id,{
      nome:o.nome,sigla:o.sigla,codigo:o.codigo,
      morada:o.morada,codigo_postal:o.codigoPostal,localidade:o.localidade,
      area:o.area,estado:o.estado,tipo_obra:o.tipoObra,subtipo:o.subtipo,
      pisos_acima:o.pisosAcima,pisos_abaixo:o.pisosAbaixo,
      ambito:o.ambito,principais_desafios:o.principaisDesafios,
      data_consignacao:o.dataConsignacao||null,
      valor_obra:o.valorObra,inicio_previsto:o.inicioPrevisto,
      inicio_real:o.inicioReal,fim_previsto:o.fimPrevisto,
      prorrogacoes:o.prorrogacoes||[],
      rel_mensal:o.relMensal===true,
      empresa_dono_obra:o.empresaDonoObra||'',
      empresa_empreiteiro:o.empresaEmpreiteiro||'',
    });
    auditLog('Obra',o.nome,'editada','inline edit');
    showToast('Guardado ✓');
  }catch(e){showToast('Erro: '+e.message,'danger');}
  render();
}

function fieldR(l,v){return`<div class="field-row"><div class="field-label">${l}</div><div class="field-value">${v}</div></div>`;}
function fieldR1(l,v){return`<div class="field-row" style="grid-template-columns:160px 1fr;"><div class="field-label">${l}</div><div class="field-value" style="grid-column:2/3">${v}</div></div>`;}
function fieldR2(l1,v1,l2,v2){

let modalObraTab='Principal';
let editingObraId=null;
// obraBuffer holds ALL form data across tabs so switching tabs never loses data
let obraBuffer={};

function flushCurrentTab(){
  // Save whatever is currently visible in the DOM into obraBuffer
  const get=id=>$(id)?.value??null;
  const getN=id=>{const v=parseFloat($(id)?.value);return isNaN(v)?null:v;};
  const getI=id=>{const v=parseInt($(id)?.value);return isNaN(v)?null:v;};
  const tab=modalObraTab;
  if(tab==='Principal'){
    Object.assign(obraBuffer,{
      codigo:get('f-cod')||obraBuffer.codigo,
      sigla:get('f-sig')??obraBuffer.sigla,
      nome:get('f-nom')||obraBuffer.nome,
      morada:get('f-mor')??obraBuffer.morada,
      codigoPostal:get('f-cp')??obraBuffer.codigoPostal,
      localidade:get('f-loc')??obraBuffer.localidade,
      estado:get('f-est')||obraBuffer.estado||'Em Preparação',
      tipoObra:get('f-tip')??obraBuffer.tipoObra,
      subtipo:get('f-sub')??obraBuffer.subtipo,
      area:getN('f-area')??obraBuffer.area,
      pisosAcima:getI('f-pa')??obraBuffer.pisosAcima,
      pisosAbaixo:getI('f-pb')??obraBuffer.pisosAbaixo,
      ambito:get('f-amb')??obraBuffer.ambito,
      principaisDesafios:get('f-des')??obraBuffer.principaisDesafios,
      dataConsignacao:get('f-dat')??obraBuffer.dataConsignacao,
      valorObra:getN('f-valo')??obraBuffer.valorObra,
      inicioPrevisto:get('f-inp')??obraBuffer.inicioPrevisto,
      inicioReal:get('f-inr')??obraBuffer.inicioReal,
      fimPrevisto:get('f-fip')??obraBuffer.fimPrevisto,
    });
  } else if(tab==='Intervenientes'){
    Object.assign(obraBuffer,{
      intervenientes_do:Array.from(document.querySelectorAll('[data-intv="intervenientes_do"]:checked')).map(x=>x.value),
      intervenientes_fisc:Array.from(document.querySelectorAll('[data-intv="intervenientes_fisc"]:checked')).map(x=>x.value),
      intervenientes_emp:Array.from(document.querySelectorAll('[data-intv="intervenientes_emp"]:checked')).map(x=>x.value),
      intervenientes_proj:Array.from(document.querySelectorAll('[data-intv="intervenientes_proj"]:checked')).map(x=>x.value),
    });
  }
  // Documentos are managed directly in obraBuffer.docs by addDoc/removeDoc
}

function obraModalTabs(){
  const tabs=['Principal','Intervenientes e Documentos'];
  return `<div class="modal-tabs">${tabs.map(t=>`<div class="modal-tab ${modalObraTab===t?'active':''}" onclick="switchObraModalTab('${t}')">${t}</div>`).join('')}</div>`;
}
window.switchObraModalTab=function(t){
  flushCurrentTab(); // save current tab before switching
  modalObraTab=t;
  const body=$('modal-body');
  if(!body)return;
  body.innerHTML=obraModalTabs()+obraModalContent(t,obraBuffer);
};

// Format number with locale separator as user types
window.syncValoObra=function(display){
  const clean=display.replace(/[^0-9,.]/g,'');
  const normalized=clean.replace(/\.(?=\d{3}(?:[,.]|$))/g,'').replace(',','.');
  const num=normalized===''?'':parseFloat(normalized);
  const fld=$('f-valo');
  if(fld)fld.value=isNaN(num)?'':num;
  obraBuffer.valorObra=isNaN(num)||normalized===''?null:num;
  calcM2();
};
window.syncValFat=function(display){
  const clean=display.replace(/[^0-9,.]/g,'');
  const normalized=clean.replace(/\.(?=\d{3}(?:[,.]|$))/g,'').replace(',','.');
  const num=normalized===''?'':parseFloat(normalized);
  const fld=$('f-val');
  if(fld)fld.value=isNaN(num)?'':num;
  obraBuffer.valor=isNaN(num)||normalized===''?null:num;
};
window.calcDuracao=function(){
  const ip=$('f-ip')?.value, fim=$('f-fim')?.value;
  const el=$('f-pra');
  if(!el)return;
  if(ip&&fim){const d=Math.round((new Date(fim)-new Date(ip))/86400000);el.value=isNaN(d)?'':d;}
  else el.value='';
};
window.refreshProrrs=function(){
  flushCurrentTab();
  fichObraTab='Principal';
  render();
};
window.calcM2=function(){
  const v=parseFloat($('f-valo')?.value)||0;
  const a=parseFloat($('f-area')?.value)||obraBuffer.area||0;
  if(v&&a) $('f-vm2').value=Math.round(v/a).toLocaleString('pt-PT');
};

// Helper — qual o array de prorrogações alvo (ficha edit usa buffer; modal usa obraBuffer)
function getProrrTarget(){
  if(fichObraEdit && fichObraId){
    if(fichaProrrBuffer===null){
      const o=DB.obras.find(x=>x.id===fichObraId);
      fichaProrrBuffer=o?JSON.parse(JSON.stringify(o.prorrogacoes||[])):[];
    }
    return {arr:fichaProrrBuffer, isFicha:true};
  }
  if(!obraBuffer.prorrogacoes)obraBuffer.prorrogacoes=[];
  return {arr:obraBuffer.prorrogacoes, isFicha:false};
}

window.addProrr=function(){
  const t=getProrrTarget();
  if(!t.isFicha)flushCurrentTab();
  t.arr.push({data:'',novoFim:''});
  fichObraTab='Principal';
  render();
};
window.removeProrr=function(i){
  const t=getProrrTarget();
  if(!t.isFicha)flushCurrentTab();
  t.arr.splice(i,1);
  fichObraTab='Principal';
  render();
};
window.updateProrr=function(i,field,val){
  const t=getProrrTarget();
  if(!t.arr[i])t.arr[i]={};
  t.arr[i][field]=val;
};
window.addDoc=function(){
  const tipo=$('doc-tipo')?.value;
  if(!tipo){alert('Selecione o tipo de documento.');return;}
  const intervenientes=Array.from(document.querySelectorAll('.cb-doc-intv:checked')).map(x=>x.value);
  if(!intervenientes.length){alert('Selecione pelo menos um interveniente.');return;}
  if(!obraBuffer.docs)obraBuffer.docs=[];
  obraBuffer.docs.push({tipo,data:$('doc-data')?.value||'',versao:$('doc-versao')?.value||'',validade:$('doc-validade')?.value||'',intervenientes});
  modalObraTab='Documentos';
  const body=$('modal-body');
  if(body)body.innerHTML=obraModalTabs()+obraModalContent('Documentos',obraBuffer);
};
window.removeDoc=function(i){
  if(obraBuffer.docs)obraBuffer.docs.splice(i,1);
  modalObraTab='Documentos';
  const body=$('modal-body');
  if(body)body.innerHTML=obraModalTabs()+obraModalContent('Documentos',obraBuffer);
};

function bindObraEvents(){}

function collectObraForm(){
  flushCurrentTab(); // save whatever tab is visible now
  return {...obraBuffer};
}

function modalNovaObra(){
  editingObraId=null;
  modalObraTab='Principal';
  obraBuffer={estado:'Em Preparação',docs:[],prorrogacoes:[],
    intervenientes_do:[],intervenientes_fisc:[],intervenientes_emp:[],intervenientes_proj:[]};
  showModal('Nova Obra',obraModalTabs()+obraModalContent('Principal',obraBuffer),[
    {label:'Cancelar',cls:'btn-outline',fn:'closeModal()'},
    {label:'Guardar',cls:'btn-gold',fn:'saveNovaObra()'},
  ],'modal-lg');
}
window.saveNovaObra=async function(){
  const v=collectObraForm();
  if(!v.codigo||!v.nome){alert('Código e Nome são obrigatórios (tab Principal).');return;}
  const novo={id:uid(),...v};
  try {
    showLoadingOverlay('A guardar...');
    await sb.post('obras', unmapObra(novo));
    DB.obras.push(novo);
    hideLoadingOverlay();
    auditLog('Obra',v.nome,'criado');
    closeModal();render();
  } catch(e) { hideLoadingOverlay(); alert('Erro ao criar obra: '+e.message); }
};
function modalEditObra(id){
  editingObraId=id;
  modalObraTab='Principal';
  const o=obraById(id);
  if(!o)return;
  // Deep-copy the obra into obraBuffer so edits don't touch DB until Guardar
  obraBuffer=JSON.parse(JSON.stringify(o));
  if(!obraBuffer.docs)obraBuffer.docs=[];
  if(!obraBuffer.prorrogacoes)obraBuffer.prorrogacoes=[];
  if(!obraBuffer.intervenientes_do)obraBuffer.intervenientes_do=[];
  if(!obraBuffer.intervenientes_fisc)obraBuffer.intervenientes_fisc=[];
  if(!obraBuffer.intervenientes_emp)obraBuffer.intervenientes_emp=[];
  if(!obraBuffer.intervenientes_proj)obraBuffer.intervenientes_proj=[];
  showModal('Editar Obra — '+o.nome,obraModalTabs()+obraModalContent('Principal',obraBuffer),[
    {label:'Cancelar',cls:'btn-outline',fn:'closeModal()'},
    {label:'Guardar',cls:'btn-gold',fn:`saveEditObra('${id}')`},
  ],'modal-lg');
}
window.saveEditObra=async function(id){
  const o=obraById(id);
  if(!o)return;
  const v=collectObraForm();
  Object.assign(o,v);
  try {
    showLoadingOverlay('A guardar...');
    await sb.patch('obras', id, unmapObra(o));
    hideLoadingOverlay();
    auditLog('Obra',o.nome,'editado');
    closeModal();
    fichObraTab='Principal';render();
  } catch(e) { hideLoadingOverlay(); alert('Erro ao guardar: '+e.message); }
};

window.saveNovoInterv=async function(){
  const nome=$('i-nom').value.trim();
  if(!nome){alert('Nome é obrigatório.');return;}
  const email=($('i-em').value||'').trim();
  const obras=Array.from(document.querySelectorAll('.cb-intv-obra:checked')).map(x=>x.value);
  const esps=Array.from(document.querySelectorAll('.cb-intv-esp:checked')).map(x=>x.value);
  const roleMap={donosObra:'dono_obra',fiscalizacao:'fiscalizacao',equipaObra:'fiscalizacao',projetistas:'projetista'};
  const role=roleMap[intervTab]||'fiscalizacao';
  const pid=uid();
  const novo={
    id:pid, nome, email,
    contacto:$('i-tel').value||'',
    funcao:role==='projetista'?'Projetista':($('i-fun').value||''),
    role,
    obras:[],
    ativo:true,
    pwd:'', pwd_hash:'', apps:['sid'], foto:'',
    especialidades:role==='projetista'?esps:[],
  };
  try{
    showLoadingOverlay('A guardar...');
    await sb.post('utilizadores', unmapUtil(novo));
    DB.utilizadores.push(novo);
    // refresh derived arrays
    DB.intervenientes.donosObra = DB.utilizadores.filter(u=>u.role==='dono_obra');
    DB.intervenientes.fiscalizacao = DB.utilizadores.filter(u=>u.role==='fiscalizacao'||u.role==='superadmin');
    DB.intervenientes.projetistas = DB.utilizadores.filter(u=>u.role==='projetista');
    // Associar obras
    const field=getIntervObraField();
    for(const oid of obras){
      const o=obraById(oid);
      if(o){
        if(!o[field])o[field]=[];
        if(!o[field].includes(pid)){
          o[field].push(pid);
          try{await sb.patch('obras',oid,{[field]:o[field]});}catch(e){console.error('Falha a associar obra '+oid+':',e);}
        }
      }
    }
    hideLoadingOverlay();
    auditLog('Interveniente',nome,'criado');
    closeModal();render();
  }catch(e){
    hideLoadingOverlay();
    alert('Erro ao criar interveniente: '+e.message);
  }
};

window.saveEditInterv=async function(id){
  const u=DB.utilizadores.find(x=>x.id===id);
  if(!u){alert('Utilizador não encontrado.');return;}
  u.nome=$('i-nom').value;
  u.funcao=intervTab==='projetistas'?'Projetista':$('i-fun').value;
  u.email=$('i-em').value;
  u.contacto=$('i-tel').value;
  if(intervTab==='projetistas'){
    u.role='projetista';
    u.especialidades=Array.from(document.querySelectorAll('.cb-intv-esp:checked')).map(x=>x.value);
  }
  const obras=Array.from(document.querySelectorAll('.cb-intv-obra:checked')).map(x=>x.value);
  const field=getIntervObraField();
  // Remover este id de todas as obras + repor nas selecionadas
  const obrasAlteradas=new Set();
  DB.obras.forEach(o=>{
    if(o[field]&&o[field].includes(id)){o[field]=o[field].filter(x=>x!==id);obrasAlteradas.add(o.id);}
  });
  obras.forEach(oid=>{
    const o=obraById(oid);
    if(o){
      if(!o[field])o[field]=[];
      if(!o[field].includes(id)){o[field].push(id);obrasAlteradas.add(o.id);}
    }
  });
  try{
    showLoadingOverlay('A guardar...');
    await sb.patch('utilizadores',id,unmapUtil(u));
    // Persistir alterações nas obras afectadas
    for(const oid of obrasAlteradas){
      const o=obraById(oid);
      if(o){try{await sb.patch('obras',oid,{[field]:o[field]||[]});}catch(e){console.error('Falha a actualizar obra '+oid+':',e);}}
    }
    hideLoadingOverlay();
    auditLog('Interveniente',u.nome,'editado');
    closeModal();render();
  }catch(e){
    hideLoadingOverlay();
    alert('Erro ao guardar: '+e.message);
  }
};
